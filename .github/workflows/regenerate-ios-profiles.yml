name: Regenerate iOS Provisioning Profiles

# Run this workflow manually after changing App ID capabilities in Apple
# Developer (e.g. enabling "Access WiFi Information"). It force-regenerates
# the provisioning profiles via fastlane match so that the new entitlements
# are baked into the profile stored in the match git repo. Subsequent
# normal builds will then pick up the refreshed profile via setup_signing.

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Which scheme to regenerate (default: both)'
        required: false
        type: choice
        default: 'both'
        options:
          - both
          - Private
          - Production
      profile-type:
        description: 'Profile type to regenerate (ad hoc is used by Firebase)'
        required: true
        type: choice
        default: appstore
        options:
          - appstore
          - adhoc

concurrency:
  group: ios-profile-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate provisioning profiles
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Regenerate provisioning profiles
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_WRITE_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_WRITE_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          PROFILE_TYPE: ${{ inputs.profile-type }}
          PROFILE_SCHEME: ${{ inputs.scheme }}
        run: |
          cd ios
          if [ "$PROFILE_SCHEME" = "both" ]; then
            bundle exec fastlane regenerate_profiles type:"$PROFILE_TYPE"
          else
            bundle exec fastlane regenerate_profiles type:"$PROFILE_TYPE" scheme:"$PROFILE_SCHEME"
          fi
