name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'remote/monkeymux/**'
      - '!remote/monkeymux/**/*_test.go'
      - 'remote/monkeymux/conpty/**'
      - '!remote/monkeymux/README.md'
      - 'third_party/**'
      - 'android/**'
      - '!android/fastlane/metadata-*/**'
      - 'ios/**'
      - '!ios/fastlane/metadata-*/**'
      - 'scripts/build_monkeymux_assets.sh'
      - 'scripts/deterministic_gzip.go'
      - 'scripts/ensure_monkeymux_assets.sh'
      - 'scripts/verify_monkeymux_assets.py'
      - 'scripts/cache_sqlite3_native_assets.sh'
      - 'scripts/version_codename.py'
      - 'scripts/preview_release_notes.rb'
      - 'scripts/preview_build_number.py'
      - 'scripts/store_metadata.rb'
      - 'scripts/match_git_persistence.rb'
      - 'scripts/testflight_delivery.rb'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/build-deploy.yml'
      - '.github/workflows/deploy-private.yml'
      - '.github/workflows/firebase-distribution.yml'
      - '.github/workflows/preview.yml'
      - '.github/workflows/preview-ios.yml'
      - '.github/actions/apple-cache-restore/**'
      - '.github/actions/apple-cache-save/**'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  compute-version:
    name: Compute Version
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
      build-codename: ${{ steps.version.outputs.build-codename }}
      build-display: ${{ steps.version.outputs.build-display }}
      commits-list: ${{ steps.commits.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Preserve preview version helper
        run: cp scripts/preview_build_number.py "$RUNNER_TEMP/preview_build_number.py"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=$(python3 "$RUNNER_TEMP/preview_build_number.py")
          BUILD_CODENAME=$(python3 scripts/version_codename.py "$BASE_VERSION")
          BUILD_DISPLAY="$BASE_VERSION"
          if [ -n "$BUILD_CODENAME" ]; then
            BUILD_DISPLAY="$BASE_VERSION \"$BUILD_CODENAME\""
          fi

          echo "build-name=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build-number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build-codename=${BUILD_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "build-display=${BUILD_DISPLAY}" >> "$GITHUB_OUTPUT"

      - name: Write version metadata
        run: |
          mkdir -p preview-metadata
          cat > preview-metadata/version.json <<'JSON'
          {
            "build-name": "${{ steps.version.outputs.build-name }}",
            "build-number": "${{ steps.version.outputs.build-number }}",
            "build-codename": "${{ steps.version.outputs.build-codename }}",
            "pr-number": "${{ github.event.pull_request.number }}",
            "source-sha": "${{ github.event.pull_request.head.sha }}"
          }
          JSON

      - name: Upload version metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          compression-level: 0
          name: preview-version-metadata
          path: preview-metadata/version.json
          retention-days: 1
          if-no-files-found: error

      - name: List PR commits
        id: commits
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MAX_DISPLAY = 25;
            const sanitize = (s) => s
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/@/g, '@\u200b');

            const count = ${{ github.event.pull_request.commits }};
            const lastPage = Math.max(1, Math.ceil(count / 100));
            const { data: page } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              per_page: 100,
              page: lastPage,
            });
            page.reverse();
            const displayed = page.slice(0, MAX_DISPLAY);
            const lines = displayed.map(c => {
              const sha = c.sha.substring(0, 7);
              const msg = sanitize(c.commit.message.split('\n')[0]);
              return `- \`${sha}\` ${msg}`;
            });
            if (count > displayed.length) {
              lines.push(`- *... and ${count - displayed.length} more*`);
            }
            const summary = `${count} commit${count !== 1 ? 's' : ''} (newest first)`;
            const body = lines.join('\n');
            core.setOutput('list', `### Commits\n\n<details>\n<summary>${summary}</summary>\n\n${body}\n\n</details>`);

  comment-initial:
    name: PR Comment (Queued)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: preview-build
          recreate: true
          message: |
            ## 📱 Preview Build

            | | Details |
            |---|---|
            | **Version** | `${{ needs.compute-version.outputs.build-display }}` (PR #${{ github.event.pull_request.number }}) |
            | **Build** | `${{ needs.compute-version.outputs.build-number }}` |
            | **Android Status** | ⏳ Building |
            | **iOS Status** | ⏳ Building (separate run) |

            ### Install
            | Platform | Link |
            |----------|------|
            | 🍎 **iOS** | Builds in a separate run; available after a PR preview deploy |
            | 🤖 **Android** | [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ### Promote
            Comment `/deploy` on this PR to deploy the current PR head to TestFlight and the Play Store internal track. The deploy workflow reuses these unsigned preview intermediates when their build number is still deployable; otherwise it rebuilds with a newer build number before uploading.

            ${{ needs.compute-version.outputs.commits-list }}

            > Build triggered by ${{ github.event.pull_request.head.sha }}
            <!-- preview-build-source-sha:${{ github.event.pull_request.head.sha }} -->
            <!-- preview-build-name:${{ needs.compute-version.outputs.build-name }} -->
            <!-- preview-build-codename:${{ needs.compute-version.outputs.build-codename }} -->
            <!-- preview-build-number:${{ needs.compute-version.outputs.build-number }} -->
            <!-- preview-build-run-id:${{ github.run_id }} -->

  build-android:
    name: Build Android Preview
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-name: ${{ needs.compute-version.outputs.build-name }}
      build-number: ${{ needs.compute-version.outputs.build-number }}
      build-codename: ${{ needs.compute-version.outputs.build-codename }}
      pr-number: ${{ github.event.pull_request.number }}
      pr-title: ${{ github.event.pull_request.title }}
      enable-diagnostics: true
      flavor: private
      source-ref: ${{ github.event.pull_request.head.sha }}
      deploy-ios-to: none
      deploy-android-to: none
      build-ios: false
      build-android: true
      android-runner: ubicloud-standard-8
      build-android-unsigned-aab: true
      android-target-platform: android-arm64
    secrets:
      FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON }}

  comment-android:
    name: PR Comment (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compute-version, build-android]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: write
      actions: read
      pull-requests: write
    steps:
      - name: Resolve preview status
        id: preview-status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              filter: 'latest',
              per_page: 100,
            });
            const statusFor = (job) => {
              if (!job || job.status !== 'completed') return '⏳ Building';
              switch (job.conclusion) {
                case 'success':
                  return '✅ Built';
                case 'skipped':
                  return '⏭️ Skipped';
                case 'cancelled':
                  return '⛔ Cancelled';
                default:
                  return '❌ Failed';
              }
            };
            const androidJob = jobs.find((job) =>
              job.name.startsWith('Build Android Preview / Build & Deploy Android'),
            );
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const apkArtifact = artifacts.find((artifact) =>
              artifact.name.startsWith('android-apk-private-'),
            );
            let androidLink = `[View workflow run](${runUrl})`;
            const androidLinks = [];
            if (apkArtifact) {
              androidLinks.push(`[Download APK artifact](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${apkArtifact.id})`);
            }
            if (androidLinks.length > 0) {
              androidLink = androidLinks.join('<br>');
            }
            if (androidJob && androidJob.status === 'completed') {
              if (androidJob.conclusion === 'skipped') {
                androidLink = 'N/A (build skipped for fork PR)';
              }
            }
            core.setOutput('android-status', statusFor(androidJob));
            core.setOutput('android-link', androidLink);

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: preview-build
          recreate: true
          message: |
            ## 📱 Preview Build

            | | Details |
            |---|---|
            | **Version** | `${{ needs.compute-version.outputs.build-display }}` (PR #${{ github.event.pull_request.number }}) |
            | **Build** | `${{ needs.compute-version.outputs.build-number }}` |
            | **Android Status** | ${{ steps.preview-status.outputs.android-status }} |
            | **iOS Status** | ⏳ Building (separate run) |

            ### Install
            | Platform | Link |
            |----------|------|
            | 🍎 **iOS** | Builds in a separate run; available after a PR preview deploy |
            | 🤖 **Android** | ${{ steps.preview-status.outputs.android-link }} |

            ### Promote
            Comment `/deploy` on this PR to deploy the current PR head to TestFlight and the Play Store internal track. The deploy workflow reuses these unsigned preview intermediates when their build number is still deployable; otherwise it rebuilds with a newer build number before uploading.

            ${{ needs.compute-version.outputs.commits-list }}

            > Build triggered by ${{ github.event.pull_request.head.sha }}
            <!-- preview-build-source-sha:${{ github.event.pull_request.head.sha }} -->
            <!-- preview-build-name:${{ needs.compute-version.outputs.build-name }} -->
            <!-- preview-build-codename:${{ needs.compute-version.outputs.build-codename }} -->
            <!-- preview-build-number:${{ needs.compute-version.outputs.build-number }} -->
            <!-- preview-build-run-id:${{ github.run_id }} -->
