name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  # ---------------------------------------------------------------------------
  # Detect which files changed so we can keep the required CI check green while
  # still skipping expensive Flutter work for docs-only or other non-app edits.
  # PRs diff against the base branch, merge_group diffs against its base SHA,
  # and push events diff against the previous commit when available.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    outputs:
      run_check: ${{ steps.filter.outputs.run_check }}
      go: ${{ steps.filter.outputs.go }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The checked-out PR/merge commit contains both diff parents. Avoid
          # fetching the binary-heavy full history just to classify changed files.
          fetch-depth: 2

      - name: Detect platform changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_SHA="$MG_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] &&
               [ -n "$PUSH_BEFORE_SHA" ] &&
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            # Fallback for first pushes or missing history — run the full suite.
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            for p in android ios macos windows linux; do
              echo "$p=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          if ! changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "::warning::git diff failed — building all platforms as a safety net"
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            for p in android ios macos windows linux; do
              echo "$p=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          matches() { echo "$changed" | grep -qE "$1" && echo "true" || echo "false"; }

          # The MonkeyMux helper is a standalone Go module whose ignored app
          # assets are generated by CI from the checked-out source.
          go_changed=$(matches '(^remote/monkeymux/|^\.github/workflows/ci\.yml$|^scripts/(build|ensure)_monkeymux_assets\.sh$)')
          echo "go=$go_changed" >> "$GITHUB_OUTPUT"

          run_check=$(matches '(\.dart$|^pubspec\.(yaml|lock)$|^analysis_options\.yaml$|^\.github/workflows/|^scripts/|^assets/|^remote/monkeymux/|^(android|ios|macos|windows|linux|web)/)')
          echo "run_check=$run_check" >> "$GITHUB_OUTPUT"

          if [ "$run_check" != "true" ]; then
            for p in android ios macos windows linux; do
              echo "$p=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          global=$(matches '^(pubspec\.(yaml|lock)|\.github/workflows/|scripts/|assets/|remote/monkeymux/)')

          for platform in android ios macos windows linux; do
            platform_changed=$(matches "^${platform}/")
            if [ "$global" = "true" ] || [ "$platform_changed" = "true" ]; then
              echo "$platform=true" >> "$GITHUB_OUTPUT"
            else
              echo "$platform=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # ---------------------------------------------------------------------------
  # Lightweight success path for docs-only or other non-Flutter changes.
  noop:
    name: No-op
    needs: changes
    if: needs.changes.outputs.run_check != 'true' && needs.changes.outputs.go != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip heavy CI
        run: echo "No Flutter-relevant changes detected; CI is a no-op."

  # Generate the ignored helper payload once, then fan the exact same bytes out
  # to every Flutter test and package job in this workflow run.
  monkeymux-assets:
    name: Build MonkeyMux Assets
    needs: changes
    if: needs.changes.outputs.run_check == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      - name: Build assets
        run: scripts/ensure_monkeymux_assets.sh

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monkeymux-assets
          path: assets/monkeymux/
          compression-level: 0
          retention-days: 1

  # Formatting and analyzer checks for Flutter-relevant changes. Tests run in a
  # separate sharded matrix so the largest per-commit step can fan out.
  # ---------------------------------------------------------------------------
  check:
    name: Analyze & Format
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.run_check == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-warnings --fatal-infos --no-pub

  test:
    name: Test (Shard ${{ matrix.shard-index }}/4)
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.run_check == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: scripts/cache_sqlite3_native_assets.sh linux-x64

      - name: Run tests
        run: flutter test --no-pub --total-shards 4 --shard-index ${{ matrix.shard-index }}

  # ---------------------------------------------------------------------------
  # MonkeyMux helper (Go) — a standalone module under remote/monkeymux that is
  # shipped to remote hosts as the prebuilt binaries in assets/monkeymux/.
  #
  # Runs on both Linux and Windows because the helper supports both as a remote
  # host and the two platforms cover disjoint test sets: the bulk of the suite
  # is //go:build !windows (it needs creack/pty and the unixPty type), while the
  # ConPTY backend tests are //go:build windows.
  # ---------------------------------------------------------------------------
  go-test:
    name: Go Tests (${{ matrix.name }})
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: remote/monkeymux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      # Checked on Linux only: the repository has no .gitattributes, so a
      # Windows runner checks out CRLF and gofmt would flag every file.
      - name: Check formatting
        if: matrix.name == 'linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo and a C toolchain, which is dependable on
      # the Linux runner but not on Windows; run the Windows set without it
      # rather than make the job depend on a preinstalled gcc.
      - name: Test
        run: |
          if [ "${{ matrix.name }}" = "linux" ]; then
            go test -race ./...
          else
            go test ./...
          fi

      # Vet the platform-gated sources (including their tests) that this
      # runner's own GOOS excludes from the checks above.
      - name: Vet other platforms
        if: matrix.name == 'linux'
        run: |
          for goos in darwin windows; do
            echo "vetting $goos"
            GOOS="$goos" go vet ./...
          done

  # ---------------------------------------------------------------------------
  # Platform builds — conditional on detected changes.
  #
  # * PRs and merge_group: only build platforms whose native code or
  #   dependencies changed. Dart-only changes skip all builds (analyze + test
  #   is sufficient). The merge_group still runs affected platform builds so
  #   that concurrent PRs touching the same native code are validated.
  # * push (main/develop): diff against the previous commit when possible.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          add-job-summary: on-failure

      - name: Configure CI Gradle properties
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
          } >> ~/.gradle/gradle.properties

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: |
          scripts/cache_sqlite3_native_assets.sh \
            android-arm64 android-x64 android-arm android-ia32

      - name: Configure Firebase for Android
        env:
          FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON" ]; then
            echo "FLUTTY_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p android/app/src/production
          printf '%s' "$FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON" > android/app/src/production/google-services.json
          echo "FLUTTY_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Generate CI release signing config
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-release.keystore \
            -storepass ci-release \
            -keypass ci-release \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI Release,O=GitHub Actions,C=US"
          cat > android/app/key.properties << EOF
          storePassword=ci-release
          keyPassword=ci-release
          keyAlias=ci-release
          storeFile=ci-release.keystore
          EOF

      - name: Build release APK
        run: |
          flutter build apk \
            --flavor production \
            --release \
            --no-tree-shake-icons \
            --target-platform android-arm64 \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/app/outputs/flutter-apk/app-production-release.apk
          archive: false
          retention-days: 5

      - name: Clean up CI signing config
        if: always()
        run: rm -f android/app/key.properties android/app/ci-release.keystore

  build-ios:
    name: Build iOS
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      # Keep release validation on the runner Xcode that includes the installed
      # iOS simulator runtime. Newer side-by-side Xcodes can drift ahead of the
      # available runtime and fail builds before Flutter starts.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      # GitHub scopes caches per ref, so an entry written from a PR is invisible
      # to every other PR. Writing unconditionally gave each PR its own ~440MB
      # copy against a shared 10GB budget, which evicts the ~2GB Flutter SDK
      # caches and slows every job. The save step below therefore writes only
      # when the exact key is missing, so as long as dependencies hold still
      # there is exactly one entry -- written by a push to main -- that every PR
      # restores.
      #
      # The entry is shared between the iOS and macOS jobs: SwiftPM keys its
      # cache on package identity, not platform, and the binary artifact bundles
      # carry every platform slice. Hashing both Package.resolved files means
      # either one moving invalidates it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: spm-cache
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Drop cached SwiftPM manifest evaluations
        # permission_handler_apple's Package.swift derives its PERMISSION_*
        # macros from the app's Info.plist, which SwiftPM does not track as a
        # manifest input, so a restored manifest cache can keep stale
        # permissions compiled in after a usage-description change. Delete it
        # after restore rather than excluding it from the cache: actions/cache
        # exclusion patterns silently did not match here, and re-evaluating a
        # handful of manifests costs seconds.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/manifests

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: scripts/cache_sqlite3_native_assets.sh ios-arm64

      - name: Configure Firebase for iOS
        env:
          FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "FLUTTY_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ios/Runner/Firebase/production
          printf '%s' "$FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/Firebase/production/GoogleService-Info.plist
          echo "FLUTTY_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Disable iOS code signing for CI
        run: |
          cat >> ios/Flutter/Release.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = 0000000000
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          EOF

      - name: Build iOS (no codesign)
        run: |
          flutter build ios \
            --flavor production \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --split-debug-info=.debug-info \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Upload iOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-build
          path: build/ios/iphoneos/MonkeySSH.app
          compression-level: 0
          retention-days: 5

      - name: Save SwiftPM cache
        # Write only when this exact key is not stored yet. Steady state that is
        # never: main holds the entry, every PR restores it, and nothing new is
        # written. A PR that moves Package.resolved misses the exact key, falls
        # back to main's entry via the prefix, and stores its resolved result
        # under its own ref so the rest of that PR's runs hit exactly. Concurrent
        # dependency-bumping PRs are rare enough that the extra copies are worth
        # it, and they age out once the PR is done.
        #
        # cache-hit is only true for an exact primary-key match, so a prefix
        # restore still saves. Skipping the exact hit also avoids the
        # "already exists" failure a redundant save would produce.
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

  build-macos:
    name: Build macOS
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      # GitHub scopes caches per ref, so an entry written from a PR is invisible
      # to every other PR. Writing unconditionally gave each PR its own ~440MB
      # copy against a shared 10GB budget, which evicts the ~2GB Flutter SDK
      # caches and slows every job. The save step below therefore writes only
      # when the exact key is missing, so as long as dependencies hold still
      # there is exactly one entry -- written by a push to main -- that every PR
      # restores.
      #
      # The entry is shared between the iOS and macOS jobs: SwiftPM keys its
      # cache on package identity, not platform, and the binary artifact bundles
      # carry every platform slice. Hashing both Package.resolved files means
      # either one moving invalidates it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: spm-cache
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Drop cached SwiftPM manifest evaluations
        # permission_handler_apple's Package.swift derives its PERMISSION_*
        # macros from the app's Info.plist, which SwiftPM does not track as a
        # manifest input, so a restored manifest cache can keep stale
        # permissions compiled in after a usage-description change. Delete it
        # after restore rather than excluding it from the cache: actions/cache
        # exclusion patterns silently did not match here, and re-evaluating a
        # handful of manifests costs seconds.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/manifests

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native assets
        run: scripts/cache_sqlite3_native_assets.sh macos-x64 macos-arm64

      - name: Build macOS
        run: |
          for attempt in 1 2 3; do
            if flutter build macos --release --no-tree-shake-icons; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Upload macOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/MonkeySSH.app
          compression-level: 0
          retention-days: 5

      - name: Save SwiftPM cache
        # Write only when this exact key is not stored yet. Steady state that is
        # never: main holds the entry, every PR restores it, and nothing new is
        # written. A PR that moves Package.resolved misses the exact key, falls
        # back to main's entry via the prefix, and stores its resolved result
        # under its own ref so the rest of that PR's runs hit exactly. Concurrent
        # dependency-bumping PRs are rare enough that the extra copies are worth
        # it, and they age out once the PR is done.
        #
        # cache-hit is only true for an exact primary-key match, so a prefix
        # restore still saves. Skipping the exact hit also avoids the
        # "already exists" failure a redundant save would produce.
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

  build-windows:
    name: Build Windows
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        shell: bash
        run: scripts/cache_sqlite3_native_assets.sh windows-x64

      - name: Build Windows
        run: flutter build windows --release --no-tree-shake-icons

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          compression-level: 0
          retention-days: 5

  build-linux:
    name: Build Linux
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
          version: 1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: scripts/cache_sqlite3_native_assets.sh linux-x64

      - name: Build Linux
        run: flutter build linux --release --no-tree-shake-icons

      - name: Upload Linux build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          compression-level: 0
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Gate job — the single required status check for branch protection.
  # Passes when checks/tests succeed and all triggered builds pass; correctly ignores
  # builds that were skipped because the platform was unchanged.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [changes, monkeymux-assets, check, test, go-test, build-android, build-ios, build-macos, build-windows, build-linux]
    runs-on: ubicloud-standard-4
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MONKEYMUX_ASSETS_RESULT: ${{ needs.monkeymux-assets.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          ok=true
          for name_result in \
            "changes:$CHANGES_RESULT" \
            "monkeymux-assets:$MONKEYMUX_ASSETS_RESULT" \
            "check:$CHECK_RESULT" \
            "test:$TEST_RESULT" \
            "go-test:$GO_TEST_RESULT" \
            "build-android:$ANDROID_RESULT" \
            "build-ios:$IOS_RESULT" \
            "build-macos:$MACOS_RESULT" \
            "build-windows:$WINDOWS_RESULT" \
            "build-linux:$LINUX_RESULT"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            case "$result" in
              success|skipped)
                echo "✅ $name: $result"
                ;;
              *)
                echo "❌ $name: $result"
                ok=false
                ;;
            esac
          done
          if [ "$ok" = false ]; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
