name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ---------------------------------------------------------------------------
  # Detect which files changed so we can keep the required CI check green while
  # still skipping expensive Flutter work for docs-only or other non-app edits.
  # PRs diff against the base branch, merge_group diffs against its base SHA,
  # and push events diff against the previous commit when available.
  #
  # Event policy (the GitHub Team plan allows only 5 concurrent macOS jobs, so
  # every avoidable macOS job costs the whole repo queue time):
  #   * pull_request — fast feedback. Apple/Windows builds only when that
  #     platform's own native sources moved (`<platform>_native`).
  #   * merge_group  — the gating run. Everything an affected change needs.
  #   * push (main)  — cache warming only; see the per-job `!= 'push'` guards.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    outputs:
      run_check: ${{ steps.filter.outputs.run_check }}
      go: ${{ steps.filter.outputs.go }}
      tooling: ${{ steps.filter.outputs.tooling }}
      third_party: ${{ steps.filter.outputs.third_party }}
      deps: ${{ steps.filter.outputs.deps }}
      functions: ${{ steps.filter.outputs.functions }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
      ios_native: ${{ steps.filter.outputs.ios_native }}
      macos_native: ${{ steps.filter.outputs.macos_native }}
      windows_native: ${{ steps.filter.outputs.windows_native }}
      monkeymux_fingerprint: ${{ steps.monkeymux-fingerprint.outputs.value }}
      monkeymux_cached: ${{ steps.monkeymux-cache.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The checked-out PR/merge commit contains both diff parents. Avoid
          # fetching the binary-heavy full history just to classify changed files.
          fetch-depth: 2

      - name: Detect platform changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_changes.py

      - name: Fingerprint MonkeyMux inputs
        id: monkeymux-fingerprint
        if: steps.filter.outputs.run_check == 'true' || steps.filter.outputs.go == 'true'
        run: |
          fingerprint="$(bash scripts/build_monkeymux_assets.sh --print-fingerprint)"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Check MonkeyMux cache
        id: monkeymux-cache
        if: steps.monkeymux-fingerprint.outputs.value != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: assets/monkeymux/
          key: monkeymux-assets-v1-Linux-${{ steps.monkeymux-fingerprint.outputs.value }}
          lookup-only: true

  # Lightweight GitHub-hosted probe on push to main: checks whether Apple build
  # caches or the Windows pub cache are missing on refs/heads/main (after a
  # Flutter bump, Xcode bump, or 10 GB LRU eviction) without allocating macOS
  # or Windows runners on normal merges when caches are already warm.
  cache-probe:
    name: Probe Build Caches
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.run_check == 'true' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      warm_ios: ${{ steps.probe.outputs.warm_ios }}
      warm_macos: ${{ steps.probe.outputs.warm_macos }}
      warm_windows_pub: ${{ steps.probe.outputs.warm_windows_pub }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pubspec.lock
            ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
            macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
            scripts/ci_cache_probe.py
          sparse-checkout-cone-mode: false

      - name: Probe main caches
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: python3 scripts/ci_cache_probe.py

  # Generate the ignored helper payload once when missing from the Ubicloud
  # cache or when a GitHub-hosted consumer (Apple/Windows) needs the artifact.
  # When already cached and only Ubicloud Linux jobs run (most PRs), this job is
  # skipped and downstream Linux jobs restore directly from Ubicloud cache.
  #
  # On push to main, this job remains the sole writer of the payload cache.
  monkeymux-assets:
    name: Build MonkeyMux Assets
    needs: [changes, cache-probe]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.cache-probe.result == 'success' || needs.cache-probe.result == 'skipped') &&
      (needs.changes.outputs.run_check == 'true' || needs.changes.outputs.go == 'true') &&
      (needs.changes.outputs.monkeymux_cached != 'true' ||
       needs.changes.outputs.go == 'true' ||
       (github.event_name == 'merge_group' && (needs.changes.outputs.ios == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.windows == 'true')) ||
       (github.event_name == 'pull_request' && (needs.changes.outputs.ios_native == 'true' || needs.changes.outputs.macos_native == 'true' || needs.changes.outputs.windows_native == 'true')) ||
       (github.event_name == 'push' && (needs.changes.outputs.deps == 'true' || needs.cache-probe.outputs.warm_ios == 'true' || needs.cache-probe.outputs.warm_macos == 'true')))
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fingerprint MonkeyMux inputs
        id: monkeymux-fingerprint
        run: |
          fingerprint="$(bash scripts/build_monkeymux_assets.sh --print-fingerprint)"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore MonkeyMux assets
        id: monkeymux-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: assets/monkeymux/
          key: monkeymux-assets-v1-${{ runner.os }}-${{ steps.monkeymux-fingerprint.outputs.value }}

      - name: Check cached MonkeyMux assets
        id: monkeymux-ready
        env:
          CACHE_HIT: ${{ steps.monkeymux-cache.outputs.cache-hit }}
          EXPECTED_FINGERPRINT: ${{ steps.monkeymux-fingerprint.outputs.value }}
        run: |
          if [ "$CACHE_HIT" = "true" ] &&
             [ -f assets/monkeymux/.build-inputs.sha256 ] &&
             [ "$(cat assets/monkeymux/.build-inputs.sha256)" = "$EXPECTED_FINGERPRINT" ] &&
             python3 scripts/verify_monkeymux_assets.py assets/monkeymux "$(sh remote/monkeymux/monkeymux-version.sh)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7.0.0
        if: steps.monkeymux-ready.outputs.ready != 'true'
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      - name: Build assets
        if: steps.monkeymux-ready.outputs.ready != 'true'
        run: scripts/build_monkeymux_assets.sh

      - name: Save MonkeyMux assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.monkeymux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: assets/monkeymux/
          key: ${{ steps.monkeymux-cache.outputs.cache-primary-key }}

      - name: Upload assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: monkeymux-assets
          path: assets/monkeymux/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Formatting and analyzer checks for Flutter-relevant changes. Tests run in a
  # separate sharded matrix so the largest per-commit step can fan out.
  #
  # Setup steps that only touch disjoint paths run as `background:` steps and
  # are joined with `wait:` before the first step that needs them. The payload
  # fetch writes assets/monkeymux/ while flutter-setup installs the SDK and
  # runs pub get, so the two overlap in every Flutter job below.
  # ---------------------------------------------------------------------------
  check:
    name: Analyze & Format
    needs: [changes, monkeymux-assets]
    # The merge-queue run validates the exact tree that lands on main, so the
    # push run would only re-check bytes that were already green.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.monkeymux-assets.result == 'success' || needs.monkeymux-assets.result == 'skipped') &&
      needs.changes.outputs.run_check == 'true' &&
      github.event_name != 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: $/.github/actions/fetch-monkeymux-assets
        with:
          source: ${{ needs.changes.outputs.monkeymux_cached == 'true' && 'cache' || 'artifact' }}
          fingerprint: ${{ needs.changes.outputs.monkeymux_fingerprint }}

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Wait for MonkeyMux assets
        wait: monkeymux-download

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-warnings --fatal-infos --no-pub

  tooling:
    name: Validate Workflows & Scripts
    needs: changes
    if: >-
      (needs.changes.outputs.tooling == 'true' ||
       needs.changes.outputs.run_check == 'true') &&
      github.event_name != 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # jactionlint is the maintained fork of rhysd/actionlint. Upstream 1.7.12
      # predates the step-level `background:` / `wait:` keys this workflow uses
      # and rejects them as unexpected keys (rhysd/actionlint#693 is still open).
      - name: Fetch jactionlint
        id: fetch-jactionlint
        background: true
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/jdx/jactionlint/releases/download/v1.8.2/jactionlint_1.8.2_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/jactionlint.tar.gz"
          echo "6533bd8047fc012a3f66238d84f65cacdac669da00b9f6cf042c1734c252bc93  $RUNNER_TEMP/jactionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/jactionlint.tar.gz" -C "$RUNNER_TEMP" jactionlint

      - name: Fetch gh-actions-lock
        id: fetch-actions-lock
        background: true
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/github/gh-actions-lock/releases/download/v0.2.0/linux-amd64 \
            -o "$RUNNER_TEMP/gh-actions-lock"
          echo "79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6  $RUNNER_TEMP/gh-actions-lock" | sha256sum --check
          chmod +x "$RUNNER_TEMP/gh-actions-lock"

      - name: Restore Pillow venv cache
        id: pillow-cache
        background: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .venv
          key: tooling-pillow-v1-${{ runner.os }}-py3

      - uses: ruby/setup-ruby@v1.329.0
        with:
          ruby-version: '3.3'

      - name: Wait for tooling downloads and Pillow cache
        wait: [fetch-jactionlint, fetch-actions-lock, pillow-cache]

      - name: Validate GitHub Actions workflows
        run: |
          # Validate workflow syntax and expressions without depending on optional
          # ShellCheck/Pyflakes versions from the runner image.
          "$RUNNER_TEMP/jactionlint" -shellcheck= -pyflakes=

      # Runs only enforce actions.lock for workflows already in it, and
      # Dependabot does not add new ones. Offline check: no token or network.
      - name: Check workflow lockfile coverage
        run: |
          "$RUNNER_TEMP/gh-actions-lock" --verify-local

      - name: Test Python scripts
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -c 'import PIL' 2>/dev/null; then
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet Pillow
          fi
          .venv/bin/python scripts/run_script_tests.py -s test/scripts -p '*_test.py' -j 4

      - name: Save Pillow venv cache
        if: github.event_name != 'merge_group' && steps.pillow-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .venv
          key: ${{ steps.pillow-cache.outputs.cache-primary-key }}

      - name: Test deployment orchestration
        run: |
          node --test test/scripts/resolve_preview_artifact_test.cjs test/scripts/preview_deploy_comments_test.cjs test/scripts/agent_usage_probe_test.cjs

      - name: Test Ruby scripts
        run: for test in test/scripts/*_test.rb; do ruby "$test"; done

  test:
    name: Test (Shard ${{ matrix.shard-index }}/6)
    needs: [changes, monkeymux-assets]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.monkeymux-assets.result == 'success' || needs.monkeymux-assets.result == 'skipped') &&
      needs.changes.outputs.run_check == 'true' &&
      github.event_name != 'push'
    runs-on: ubicloud-standard-8
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Balance shards by static structural test weight (scripts/ci_test_shard.py)
      # rather than Flutter's file-count modulo, and run 8 workers per shard on
      # 8-vCPU runners (48 vCPU total).
      matrix:
        shard-index: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: $/.github/actions/fetch-monkeymux-assets
        with:
          source: ${{ needs.changes.outputs.monkeymux_cached == 'true' && 'cache' || 'artifact' }}
          fingerprint: ${{ needs.changes.outputs.monkeymux_fingerprint }}

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sqlite-targets: linux-x64

      - name: Wait for MonkeyMux assets
        wait: monkeymux-download

      - name: Run tests
        # package:test defaults to numberOfProcessors ~/ 2; use all 8 vCPUs.
        run: |
          set -o pipefail
          python3 scripts/ci_test_shard.py --total-shards 6 --shard-index ${{ matrix.shard-index }} --run -- \
            flutter test --no-pub -j 8 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          compression-level: 0
          name: flutter-test-failures-${{ matrix.shard-index }}
          path: |
            ${{ runner.temp }}/flutter-test.log
            **/failures/**
          if-no-files-found: ignore
          retention-days: 7

  # The vendored pixel goldens were generated on macOS. Run the complete suite
  # there instead of comparing its rasterization with a Linux renderer.
  #
  # third_party/xterm is a standalone package with no path dependency on the
  # app, so nothing under lib/ can affect it. Gating on third_party (rather than
  # every Dart edit) keeps a macOS slot free on the vast majority of runs.
  terminal-test:
    name: Test Vendored Terminal
    needs: changes
    if: needs.changes.outputs.third_party == 'true' && github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Test vendored terminal
        working-directory: third_party/xterm
        run: |
          set -o pipefail
          flutter pub get
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/terminal-test.log"

      - name: Upload failed terminal test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          compression-level: 0
          name: terminal-test-failures
          path: |
            ${{ runner.temp }}/terminal-test.log
            third_party/xterm/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  # Thomas Dickey's esctest2 conformance suite against the vendored terminal,
  # as Ghostty runs it against its core (third_party/xterm/test/esctest). It
  # compares no pixels, so it runs on Linux and leaves the macOS pool alone.
  # esctest2 is GPL-2.0, so the pinned commit is fetched here, never vendored.
  esctest:
    name: Terminal Conformance (esctest)
    needs: changes
    if: needs.changes.outputs.third_party == 'true' && github.event_name != 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch esctest2
        id: esctest-fetch
        background: true
        run: bash third_party/xterm/test/esctest/fetch_esctest.sh "$RUNNER_TEMP/esctest2"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Wait for esctest2
        wait: esctest-fetch

      - name: Run esctest
        working-directory: third_party/xterm
        env:
          ESCTEST_DIR: ${{ runner.temp }}/esctest2
          ESCTEST_OUT: ${{ runner.temp }}/esctest
        run: |
          flutter pub get
          flutter test --no-pub test/esctest

      - name: Upload esctest logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          compression-level: 0
          name: esctest-logs
          path: ${{ runner.temp }}/esctest/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # MonkeyMux helper (Go) — a standalone module under remote/monkeymux that is
  # shipped to remote hosts as the prebuilt binaries in assets/monkeymux/.
  #
  # Runs on both Linux and Windows because the helper supports both as a remote
  # host and the two platforms cover disjoint test sets: the bulk of the suite
  # is //go:build !windows (it needs creack/pty and the unixPty type), while the
  # ConPTY backend tests are //go:build windows.
  # ---------------------------------------------------------------------------
  go-test:
    name: Go Tests (${{ matrix.name }})
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.go == 'true' && github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubicloud-standard-8
          - name: windows
            os: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: remote/monkeymux
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: $/.github/actions/fetch-monkeymux-assets
        with:
          source: ${{ matrix.name == 'linux' && needs.changes.outputs.monkeymux_cached == 'true' && 'cache' || 'artifact' }}
          fingerprint: ${{ needs.changes.outputs.monkeymux_fingerprint }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      - name: Wait for MonkeyMux assets
        wait: monkeymux-download

      # Checked on Linux only: the repository has no .gitattributes, so a
      # Windows runner checks out CRLF and gofmt would flag every file.
      - name: Check formatting
        if: matrix.name == 'linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          if [ "${{ matrix.name }}" = "linux" ]; then
            go vet ./...
          else
            CGO_ENABLED=0 go vet ./...
          fi

      # The race detector needs cgo and a C toolchain, which is dependable on
      # the Linux runner but not on Windows. Windows-2025 images still report
      # CGO_ENABLED=1 when gcc is on PATH, and a blocking ConPTY close under
      # cgo can stall `go test` until the job is cancelled.
      - name: Test
        run: |
          if [ "${{ matrix.name }}" = "linux" ]; then
            go test -race ./...
          else
            CGO_ENABLED=0 go test -timeout 8m -count=1 ./...
          fi

      # Vet the platform-gated sources (including their tests) that this
      # runner's own GOOS excludes from the checks above.
      - name: Vet other platforms
        if: matrix.name == 'linux'
        run: |
          pids=()
          for goos in darwin windows; do
            echo "vetting $goos"
            (GOOS="$goos" go vet ./...) &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          exit "$status"

  # The push Cloud Functions build and test here; deploy-functions.yml runs the
  # same suite again before it deploys from main.
  functions-test:
    name: Functions Tests
    needs: changes
    if: needs.changes.outputs.functions == 'true' && github.event_name != 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and test
        run: npm test

  # ---------------------------------------------------------------------------
  # Platform builds — conditional on detected changes.
  #
  # * merge_group: the gating run. Build every platform whose native code or
  #   shared dependencies changed, so concurrent PRs touching the same native
  #   code are validated against the tree that actually lands.
  # * pull_request: Android and Linux build as before — they run on ubicloud /
  #   ubuntu-latest and queue in under 25s. iOS, macOS and Windows additionally
  #   require their own native directory to have changed, because the Team plan
  #   caps concurrent macOS jobs at 5 and a shared-dependency bump would
  #   otherwise queue three of them behind the preview build.
  # * push (main): cache warming only — see the `!= 'push'` guards below.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android
    needs: [changes, monkeymux-assets]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.monkeymux-assets.result == 'success' || needs.monkeymux-assets.result == 'skipped') &&
      needs.changes.outputs.android == 'true' &&
      github.event_name != 'push'
    runs-on: ubicloud-standard-8
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: $/.github/actions/fetch-monkeymux-assets
        with:
          source: ${{ needs.changes.outputs.monkeymux_cached == 'true' && 'cache' || 'artifact' }}
          fingerprint: ${{ needs.changes.outputs.monkeymux_fingerprint }}

      - name: Restore Android CMake cache
        id: android-cmake-cache
        background: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/android-cmake-3.22.1
          key: android-cmake-v1-${{ runner.os }}-3.22.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # Restores ~/.gradle caches while flutter-setup fetches the SDK and pub
      # packages. The gradle.properties write below waits for it so nothing
      # else touches ~/.gradle while the cache is being unpacked.
      # Skip saving on merge_group: caches written from gh-readonly-queue refs
      # are throwaway and burn ~25s + quota without ever being read back.
      - uses: gradle/actions/setup-gradle@v6.4.0
        id: gradle-setup
        background: true
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          add-job-summary: on-failure

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sqlite-targets: android-arm64

      - name: Wait for Gradle setup, CMake cache and MonkeyMux assets
        wait: [gradle-setup, monkeymux-download, android-cmake-cache]

      - name: Configure CI Gradle properties
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
          } >> ~/.gradle/gradle.properties

      - name: Configure Firebase for Android
        uses: $/.github/actions/firebase-config
        with:
          platform: android
          config: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON }}

      - name: Generate CI release signing config
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-release.keystore \
            -storepass ci-release \
            -keypass ci-release \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI Release,O=GitHub Actions,C=US"
          cat > android/app/key.properties << EOF
          storePassword=ci-release
          keyPassword=ci-release
          keyAlias=ci-release
          storeFile=ci-release.keystore
          EOF

      # Gradle installs the NDK and CMake on first use with no download
      # timeout, so a stalled transfer from Google hangs the build until the
      # job limit. Reuse cached CMake 3.22.1 and pre-installed NDK when present,
      # installing only missing components bounded and retried.
      - name: Install Android NDK and CMake
        run: |
          flutter_root="${FLUTTER_ROOT:-$(cd "$(dirname "$(command -v flutter)")/.." && pwd)}"
          ndk="$(sed -n 's/.*val ndkVersion: String = "\([0-9.]*\)".*/\1/p' \
            "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ -z "$ndk" ]; then
            echo "::warning::Could not read Flutter's NDK version; Gradle will install the NDK itself."
            exit 0
          fi
          cmake_cache="$HOME/.cache/android-cmake-3.22.1"
          if [ ! -x "${ANDROID_HOME:?}/cmake/3.22.1/bin/cmake" ] && [ -x "$cmake_cache/bin/cmake" ]; then
            mkdir -p "$ANDROID_HOME/cmake"
            rm -rf "$ANDROID_HOME/cmake/3.22.1"
            cp -a "$cmake_cache" "$ANDROID_HOME/cmake/3.22.1"
          fi
          missing=()
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || missing+=("ndk;$ndk")
          [ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ] || missing+=("cmake;3.22.1")
          if [ "${#missing[@]}" -gt 0 ]; then
            sdkmanager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
            installed=false
            for attempt in 1 2 3; do
              if timeout 150 "$sdkmanager" --install "${missing[@]}" > /dev/null; then
                installed=true
                break
              fi
              echo "::warning::Android SDK install attempt $attempt failed or stalled."
            done
            if [ "$installed" != true ]; then
              exit 1
            fi
          fi
          if [ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ] && [ ! -x "$cmake_cache/bin/cmake" ]; then
            rm -rf "$cmake_cache"
            mkdir -p "$(dirname "$cmake_cache")"
            cp -a "$ANDROID_HOME/cmake/3.22.1" "$cmake_cache"
          fi

      - name: Save Android CMake cache
        if: github.event_name != 'merge_group' && steps.android-cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/android-cmake-3.22.1
          key: ${{ steps.android-cmake-cache.outputs.cache-primary-key }}

      - name: Build release APK
        run: |
          flutter build apk \
            --no-pub \
            --flavor production \
            --release \
            --no-tree-shake-icons \
            --target-platform android-arm64 \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Clean up CI signing config
        if: always()
        run: rm -f android/app/key.properties android/app/ci-release.keystore

  build-ios:
    name: Build iOS
    needs: [changes, cache-probe, monkeymux-assets]
    # On push this only warms the Apple compilation & SPM caches on main when a
    # dependency lockfile moved or cache-probe detected a missing main cache.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.cache-probe.result == 'success' || needs.cache-probe.result == 'skipped') &&
      needs.monkeymux-assets.result == 'success' &&
      ((github.event_name == 'push' &&
        (needs.changes.outputs.deps == 'true' || needs.cache-probe.outputs.warm_ios == 'true')) ||
       (github.event_name != 'push' &&
        needs.changes.outputs.ios == 'true' &&
        (github.event_name != 'pull_request' || needs.changes.outputs.ios_native == 'true')))
    runs-on: xcode-27
    env:
      # The iPhone Duo fold and vertical bar reader compiles only with the
      # iOS 27.1 SDK, so iOS builds use Xcode 27.1 on the xcode-27 image.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Compiles into its own temp dir with only Xcode's swiftc, so it runs
      # under the setup below instead of before it.
      - name: Test notification text (Swift)
        id: ios-notification-text-test
        background: true
        run: scripts/test_ios_push_notification_content.sh

      - name: Download MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      # The three cache restores write ~/Library/Caches and build/ios/ while
      # flutter-setup installs the SDK and pub packages, so they overlap.
      - name: Restore SwiftPM cache
        id: spm-cache
        background: true
        uses: $/.github/actions/apple-cache-restore
        with:
          phase: swiftpm

      - name: Restore Apple build caches
        id: apple-cache
        background: true
        uses: $/.github/actions/apple-cache-restore
        with:
          phase: build
          platform: ios
          configuration: production
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dependency-fingerprint: ${{ hashFiles('pubspec.lock', 'ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sqlite-targets: ios-arm64

      - name: Wait for caches, MonkeyMux assets and the Swift test
        wait: [ios-notification-text-test, monkeymux-download, spm-cache, apple-cache]

      - name: Configure Firebase for iOS
        uses: $/.github/actions/firebase-config
        with:
          platform: ios
          config: ${{ secrets.FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST }}

      - name: Disable iOS code signing for CI
        run: |
          cat >> ios/Flutter/Release.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = 0000000000
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          EOF

      - name: Build iOS (no codesign)
        id: apple-build
        shell: bash
        run: |
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH="$HOME/Library/Caches/monkeyssh-xcode"
          export FLUTTER_XCODE_COMPILATION_CACHE_LIMIT_SIZE=2560
          flutter build ios --no-pub --verbose \
            --flavor production \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --split-debug-info=.debug-info \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED" \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Save Apple build caches
        if: github.event_name != 'merge_group'
        uses: $/.github/actions/apple-cache-save
        with:
          phase: build
          platform: ios
          compilation-limit-kib: 3145728
          workspace-limit-kib: 2097152
          compilation-key: ${{ steps.apple-cache.outputs.compilation-key }}
          compilation-hit: ${{ steps.apple-cache.outputs.compilation-hit }}
          workspace-key: ${{ steps.apple-cache.outputs.workspace-key }}
          workspace-hit: ${{ steps.apple-cache.outputs.workspace-hit }}

      - name: Upload Apple build diagnostics
        if: always() && steps.apple-build.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 3

      - name: Save SwiftPM cache
        if: github.event_name != 'merge_group' && steps.spm-cache.outputs.swiftpm-hit != 'true'
        uses: $/.github/actions/apple-cache-save
        with:
          phase: swiftpm

  build-macos:
    name: Build macOS
    needs: [changes, cache-probe, monkeymux-assets]
    # On push this only warms the Apple compilation & SPM caches on main when a
    # dependency lockfile moved or cache-probe detected a missing main cache.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.cache-probe.result == 'success' || needs.cache-probe.result == 'skipped') &&
      needs.monkeymux-assets.result == 'success' &&
      ((github.event_name == 'push' &&
        (needs.changes.outputs.deps == 'true' || needs.cache-probe.outputs.warm_macos == 'true')) ||
       (github.event_name != 'push' &&
        needs.changes.outputs.macos == 'true' &&
        (github.event_name != 'pull_request' || needs.changes.outputs.macos_native == 'true')))
    runs-on: macos-26
    # macos-26 build times vary 3x on identical cache state (169s-746s observed),
    # so leave headroom rather than time out an otherwise green build.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      # Same overlap as build-ios: the restores and flutter-setup touch
      # disjoint paths.
      - name: Restore SwiftPM cache
        id: spm-cache
        background: true
        uses: $/.github/actions/apple-cache-restore
        with:
          phase: swiftpm

      - name: Restore Apple build caches
        id: apple-cache
        background: true
        uses: $/.github/actions/apple-cache-restore
        with:
          phase: build
          platform: macos
          configuration: release
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dependency-fingerprint: ${{ hashFiles('pubspec.lock', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sqlite-targets: macos-x64 macos-arm64

      - name: Wait for caches and MonkeyMux assets
        wait: [monkeymux-download, spm-cache, apple-cache]

      - name: Build macOS
        id: apple-build
        shell: bash
        run: |
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH="$HOME/Library/Caches/monkeyssh-xcode"
          export FLUTTER_XCODE_COMPILATION_CACHE_LIMIT_SIZE=4096
          flutter build macos --no-pub --release --no-tree-shake-icons --verbose \
            2>&1 | tee "$RUNNER_TEMP/macos-build.log"

      - name: Save Apple build caches
        if: github.event_name != 'merge_group'
        uses: $/.github/actions/apple-cache-save
        with:
          phase: build
          platform: macos
          compilation-limit-kib: 5242880
          workspace-limit-kib: 2097152
          compilation-key: ${{ steps.apple-cache.outputs.compilation-key }}
          compilation-hit: ${{ steps.apple-cache.outputs.compilation-hit }}
          workspace-key: ${{ steps.apple-cache.outputs.workspace-key }}
          workspace-hit: ${{ steps.apple-cache.outputs.workspace-hit }}

      - name: Upload Apple build diagnostics
        if: always() && steps.apple-build.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-macos-build-log
          path: ${{ runner.temp }}/macos-build.log
          retention-days: 3

      - name: Save SwiftPM cache
        if: github.event_name != 'merge_group' && steps.spm-cache.outputs.swiftpm-hit != 'true'
        uses: $/.github/actions/apple-cache-save
        with:
          phase: swiftpm

  # Warm the ~32-110 MB Windows pub cache on push to main when pubspec.lock or
  # FLUTTER_VERSION moved (or the cache was evicted), so build-windows on PRs
  # and merge_group can restore read-only in ~3s instead of paying ~62s in
  # uncached `flutter pub get` or ~2m45s saving a throwaway cache.
  warm-windows-pub:
    name: Warm Windows Pub Cache
    needs: [changes, cache-probe]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.cache-probe.result == 'success' || needs.cache-probe.result == 'skipped') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.deps == 'true' || needs.cache-probe.outputs.warm_windows_pub == 'true')
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore Windows pub cache
        id: win-pub-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/AppData/Local/Pub/Cache
          key: windows-pub-v1-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}

      - uses: $/.github/actions/flutter-setup
        if: steps.win-pub-cache.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: 'false'
          pub-cache: 'false'

      - name: Save Windows pub cache
        if: steps.win-pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ steps.win-pub-cache.outputs.cache-primary-key }}

  build-windows:
    name: Build Windows
    needs: [changes, monkeymux-assets]
    if: >-
      needs.changes.outputs.windows == 'true' &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.windows_native == 'true')
    runs-on: windows-2025
    # Observed peak is 813s; the old 15-minute cap left under two minutes of
    # headroom on a slow runner draw.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      # Needs only the runner's Node, so it runs under the ~2-minute Flutter
      # setup instead of after it.
      - name: Test Windows usage RPC transport
        id: windows-node-test
        background: true
        run: node --test test/scripts/agent_usage_windows_test.cjs

      # Read-only restore of the main-warmed Windows pub cache (~3-5s) so both
      # pull_request and merge_group avoid ~62s uncached `flutter pub get` and
      # never pay a ~2m45s post-job save.
      - name: Restore Windows pub cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/AppData/Local/Pub/Cache
          key: windows-pub-v1-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: windows-pub-v1-${{ env.FLUTTER_VERSION }}-

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sqlite-targets: windows-x64
          # The ~2.1 GB SDK archive cancelled otherwise successful jobs during
          # post-job save; download the SDK instead, and rely on the read-only
          # Windows pub cache restored above.
          cache: 'false'
          pub-cache: 'false'

      - name: Wait for MonkeyMux assets and the Node test
        wait: [monkeymux-download, windows-node-test]

      # Batch whole-file and name-filtered Windows-only tests into two
      # invocations to avoid redundant Dart VM and test harness cold starts.
      - name: Test Windows-only Dart behavior
        run: flutter test --no-pub -j 4 test/domain/services/agent_usage_windows_command_test.dart test/domain/services/agent_probe_parallel_test.dart test/domain/services/monkeymux_windows_cleanup_test.dart

      - name: Test Windows agent and MonkeyMux shell wrapping
        run: >-
          flutter test --no-pub -j 2
          test/domain/services/agent_management_service_test.dart
          test/domain/services/monkeymux_installer_service_test.dart
          --name "full Windows probe executes through cmd and PowerShell|Windows launcher command runs through cmd and prunes unused builds"

      - name: Build Windows
        run: flutter build windows --no-pub --release --no-tree-shake-icons

  build-linux:
    name: Build Linux
    needs: [changes, monkeymux-assets]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.monkeymux-assets.result == 'success' || needs.monkeymux-assets.result == 'skipped') &&
      needs.changes.outputs.linux == 'true' &&
      github.event_name != 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch MonkeyMux assets
        id: monkeymux-download
        background: true
        uses: $/.github/actions/fetch-monkeymux-assets
        with:
          source: ${{ needs.changes.outputs.monkeymux_cached == 'true' && 'cache' || 'artifact' }}
          fingerprint: ${{ needs.changes.outputs.monkeymux_fingerprint }}

      # Not awalsh128/cache-apt-pkgs-action: it pins actions/cache by the
      # commit our own steps reach through a tag, and gh-actions-lock 0.2.0
      # records both under the tag, so the runner's lookup by commit fails.
      - name: Install Linux build dependencies
        id: apt-packages
        background: true
        # A mirror connection can stall mid-download, and apt then waits until
        # the job times out. Give up on a stalled transfer after 30 s and retry.
        run: |
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update -qq
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: $/.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sqlite-targets: linux-x64

      - name: Wait for apt packages and MonkeyMux assets
        wait: [apt-packages, monkeymux-download]

      - name: Build Linux
        run: flutter build linux --no-pub --release --no-tree-shake-icons

  # ---------------------------------------------------------------------------
  # Gate job — the single required status check for branch protection.
  # Passes when checks/tests succeed and all triggered builds pass; correctly ignores
  # builds that were skipped because the platform was unchanged. It runs on all
  # three events: on push to main every gated job is skipped, and `skipped` is
  # treated as success below, so the cache-warm run still reports green.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [changes, cache-probe, monkeymux-assets, check, tooling, test, terminal-test, esctest, go-test, functions-test, build-android, build-ios, build-macos, warm-windows-pub, build-windows, build-linux]
    runs-on: ubicloud-standard-4
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CACHE_PROBE_RESULT: ${{ needs.cache-probe.result }}
          MONKEYMUX_ASSETS_RESULT: ${{ needs.monkeymux-assets.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TERMINAL_TEST_RESULT: ${{ needs.terminal-test.result }}
          ESCTEST_RESULT: ${{ needs.esctest.result }}
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          FUNCTIONS_TEST_RESULT: ${{ needs.functions-test.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WARM_WINDOWS_PUB_RESULT: ${{ needs.warm-windows-pub.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          ok=true
          for name_result in \
            "changes:$CHANGES_RESULT" \
            "cache-probe:$CACHE_PROBE_RESULT" \
            "monkeymux-assets:$MONKEYMUX_ASSETS_RESULT" \
            "check:$CHECK_RESULT" \
            "tooling:$TOOLING_RESULT" \
            "test:$TEST_RESULT" \
            "terminal-test:$TERMINAL_TEST_RESULT" \
            "esctest:$ESCTEST_RESULT" \
            "go-test:$GO_TEST_RESULT" \
            "functions-test:$FUNCTIONS_TEST_RESULT" \
            "build-android:$ANDROID_RESULT" \
            "build-ios:$IOS_RESULT" \
            "build-macos:$MACOS_RESULT" \
            "warm-windows-pub:$WARM_WINDOWS_PUB_RESULT" \
            "build-windows:$WINDOWS_RESULT" \
            "build-linux:$LINUX_RESULT"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            case "$result" in
              success|skipped)
                echo "✅ $name: $result"
                ;;
              *)
                echo "❌ $name: $result"
                ok=false
                ;;
            esac
          done
          if [ "$ok" = false ]; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
