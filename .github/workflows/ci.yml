name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  # ---------------------------------------------------------------------------
  # Detect which files changed so we can keep the required CI check green while
  # still skipping expensive Flutter work for docs-only or other non-app edits.
  # PRs diff against the base branch, merge_group diffs against its base SHA,
  # and push events diff against the previous commit when available.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    outputs:
      run_check: ${{ steps.filter.outputs.run_check }}
      go: ${{ steps.filter.outputs.go }}
      tooling: ${{ steps.filter.outputs.tooling }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The checked-out PR/merge commit contains both diff parents. Avoid
          # fetching the binary-heavy full history just to classify changed files.
          fetch-depth: 2

      - name: Detect platform changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_changes.py

  # ---------------------------------------------------------------------------
  # Lightweight success path for docs-only or other non-Flutter changes.
  noop:
    name: No-op
    needs: changes
    if: needs.changes.outputs.run_check != 'true' && needs.changes.outputs.go != 'true' && needs.changes.outputs.tooling != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip heavy CI
        run: echo "No Flutter-relevant changes detected; CI is a no-op."

  # Generate the ignored helper payload once, then fan the exact same bytes out
  # to every Flutter test and package job in this workflow run.
  monkeymux-assets:
    name: Build MonkeyMux Assets
    needs: changes
    if: needs.changes.outputs.run_check == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      - name: Fingerprint MonkeyMux inputs
        id: monkeymux-fingerprint
        run: |
          fingerprint="$(bash scripts/build_monkeymux_assets.sh --print-fingerprint)"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore MonkeyMux assets
        id: monkeymux-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: assets/monkeymux/
          key: monkeymux-assets-v1-${{ runner.os }}-${{ steps.monkeymux-fingerprint.outputs.value }}

      - name: Build assets
        run: scripts/ensure_monkeymux_assets.sh

      - name: Save MonkeyMux assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.monkeymux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: assets/monkeymux/
          key: ${{ steps.monkeymux-cache.outputs.cache-primary-key }}

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monkeymux-assets
          path: assets/monkeymux/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Formatting and analyzer checks for Flutter-relevant changes. Tests run in a
  # separate sharded matrix so the largest per-commit step can fan out.
  # ---------------------------------------------------------------------------
  check:
    name: Analyze & Format
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.run_check == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-warnings --fatal-infos --no-pub

  tooling:
    name: Validate Workflows & Scripts
    needs: changes
    if: needs.changes.outputs.tooling == 'true' || needs.changes.outputs.run_check == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # Validate workflow syntax and expressions without depending on optional
          # ShellCheck/Pyflakes versions from the runner image.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Test Python scripts
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet Pillow
          .venv/bin/python -m unittest discover -s test/scripts -p '*_test.py'

      - name: Test deployment orchestration
        run: |
          node --test test/scripts/resolve_preview_artifact_test.cjs test/scripts/preview_deploy_comments_test.cjs test/scripts/agent_usage_probe_test.cjs
          ruby test/scripts/store_delivery_test.rb
          ruby test/scripts/match_git_persistence_test.rb

      - name: Test release-note metadata
        run: ruby test/scripts/preview_release_notes_test.rb

      - name: Test App Store version selection
        run: ruby scripts/resolve_next_app_store_patch_version_test.rb

      - name: Test workflow job graph
        run: ruby test/scripts/workflow_job_graph_test.rb

  test:
    name: Test (Shard ${{ matrix.shard-index }}/4)
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.run_check == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: scripts/cache_sqlite3_native_assets.sh linux-x64

      - name: Run tests
        run: |
          set -o pipefail
          flutter test --no-pub --total-shards 4 --shard-index ${{ matrix.shard-index }} 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          compression-level: 0
          name: flutter-test-failures-${{ matrix.shard-index }}
          path: |
            ${{ runner.temp }}/flutter-test.log
            **/failures/**
          if-no-files-found: ignore
          retention-days: 7

  # The vendored pixel goldens were generated on macOS. Run the complete suite
  # there instead of comparing its rasterization with a Linux renderer.
  terminal-test:
    name: Test Vendored Terminal
    needs: changes
    if: needs.changes.outputs.run_check == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Test vendored terminal
        working-directory: third_party/xterm
        run: |
          set -o pipefail
          flutter pub get
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/terminal-test.log"

      - name: Upload failed terminal test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          compression-level: 0
          name: terminal-test-failures
          path: |
            ${{ runner.temp }}/terminal-test.log
            third_party/xterm/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # MonkeyMux helper (Go) — a standalone module under remote/monkeymux that is
  # shipped to remote hosts as the prebuilt binaries in assets/monkeymux/.
  #
  # Runs on both Linux and Windows because the helper supports both as a remote
  # host and the two platforms cover disjoint test sets: the bulk of the suite
  # is //go:build !windows (it needs creack/pty and the unixPty type), while the
  # ConPTY backend tests are //go:build windows.
  # ---------------------------------------------------------------------------
  go-test:
    name: Go Tests (${{ matrix.name }})
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: remote/monkeymux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      # Checked on Linux only: the repository has no .gitattributes, so a
      # Windows runner checks out CRLF and gofmt would flag every file.
      - name: Check formatting
        if: matrix.name == 'linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo and a C toolchain, which is dependable on
      # the Linux runner but not on Windows; run the Windows set without it
      # rather than make the job depend on a preinstalled gcc.
      - name: Test
        run: |
          if [ "${{ matrix.name }}" = "linux" ]; then
            go test -race ./...
          else
            go test ./...
          fi

      # Vet the platform-gated sources (including their tests) that this
      # runner's own GOOS excludes from the checks above.
      - name: Vet other platforms
        if: matrix.name == 'linux'
        run: |
          for goos in darwin windows; do
            echo "vetting $goos"
            GOOS="$goos" go vet ./...
          done

  # ---------------------------------------------------------------------------
  # Platform builds — conditional on detected changes.
  #
  # * PRs and merge_group: only build platforms whose native code or
  #   dependencies changed. Dart-only changes skip all builds (analyze + test
  #   is sufficient). The merge_group still runs affected platform builds so
  #   that concurrent PRs touching the same native code are validated.
  # * push (main): diff against the previous commit when possible.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          add-job-summary: on-failure

      - name: Configure CI Gradle properties
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
          } >> ~/.gradle/gradle.properties

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: |
          scripts/cache_sqlite3_native_assets.sh \
            android-arm64 android-x64 android-arm android-ia32

      - name: Configure Firebase for Android
        env:
          FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON" ]; then
            echo "FLUTTY_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p android/app/src/production
          printf '%s' "$FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON" > android/app/src/production/google-services.json
          echo "FLUTTY_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Generate CI release signing config
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-release.keystore \
            -storepass ci-release \
            -keypass ci-release \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI Release,O=GitHub Actions,C=US"
          cat > android/app/key.properties << EOF
          storePassword=ci-release
          keyPassword=ci-release
          keyAlias=ci-release
          storeFile=ci-release.keystore
          EOF

      - name: Build release APK
        run: |
          flutter build apk \
            --flavor production \
            --release \
            --no-tree-shake-icons \
            --target-platform android-arm64 \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/app/outputs/flutter-apk/app-production-release.apk
          archive: false
          retention-days: 5

      - name: Clean up CI signing config
        if: always()
        run: rm -f android/app/key.properties android/app/ci-release.keystore

  build-ios:
    name: Build iOS
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      # Keep release validation on the runner Xcode that includes the installed
      # iOS simulator runtime. Newer side-by-side Xcodes can drift ahead of the
      # available runtime and fail builds before Flutter starts.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - name: Restore SwiftPM cache
        id: spm-cache
        uses: ./.github/actions/apple-cache-restore
        with:
          phase: swiftpm

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: scripts/cache_sqlite3_native_assets.sh ios-arm64

      - name: Restore Apple build caches
        id: apple-cache
        uses: ./.github/actions/apple-cache-restore
        with:
          phase: build
          platform: ios
          configuration: production
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dependency-fingerprint: ${{ hashFiles('pubspec.lock', 'ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Configure Firebase for iOS
        env:
          FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "FLUTTY_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ios/Runner/Firebase/production
          printf '%s' "$FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/Firebase/production/GoogleService-Info.plist
          echo "FLUTTY_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Disable iOS code signing for CI
        run: |
          cat >> ios/Flutter/Release.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = 0000000000
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          EOF

      - name: Build iOS (no codesign)
        id: apple-build
        shell: bash
        run: |
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH="$HOME/Library/Caches/monkeyssh-xcode"
          flutter build ios --verbose \
            --flavor production \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --split-debug-info=.debug-info \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED" \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Save Apple build caches
        uses: ./.github/actions/apple-cache-save
        with:
          phase: build
          platform: ios
          compilation-limit-kib: 1048576
          workspace-limit-kib: 2097152
          compilation-key: ${{ steps.apple-cache.outputs.compilation-key }}
          compilation-hit: ${{ steps.apple-cache.outputs.compilation-hit }}
          workspace-key: ${{ steps.apple-cache.outputs.workspace-key }}
          workspace-hit: ${{ steps.apple-cache.outputs.workspace-hit }}

      - name: Upload Apple build diagnostics
        if: always() && steps.apple-build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 3

      - name: Upload iOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-build
          path: build/ios/iphoneos/MonkeySSH.app
          compression-level: 0
          retention-days: 5

      - name: Save SwiftPM cache
        if: steps.spm-cache.outputs.swiftpm-hit != 'true'
        uses: ./.github/actions/apple-cache-save
        with:
          phase: swiftpm

  build-macos:
    name: Build macOS
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - name: Restore SwiftPM cache
        id: spm-cache
        uses: ./.github/actions/apple-cache-restore
        with:
          phase: swiftpm

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native assets
        run: scripts/cache_sqlite3_native_assets.sh macos-x64 macos-arm64

      - name: Restore Apple build caches
        id: apple-cache
        uses: ./.github/actions/apple-cache-restore
        with:
          phase: build
          platform: macos
          configuration: release
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dependency-fingerprint: ${{ hashFiles('pubspec.lock', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build macOS
        id: apple-build
        shell: bash
        run: |
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
          export FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH="$HOME/Library/Caches/monkeyssh-xcode"
          flutter build macos --release --no-tree-shake-icons --verbose \
            2>&1 | tee "$RUNNER_TEMP/macos-build.log"

      - name: Save Apple build caches
        uses: ./.github/actions/apple-cache-save
        with:
          phase: build
          platform: macos
          compilation-limit-kib: 2097152
          workspace-limit-kib: 2097152
          compilation-key: ${{ steps.apple-cache.outputs.compilation-key }}
          compilation-hit: ${{ steps.apple-cache.outputs.compilation-hit }}
          workspace-key: ${{ steps.apple-cache.outputs.workspace-key }}
          workspace-hit: ${{ steps.apple-cache.outputs.workspace-hit }}

      - name: Upload Apple build diagnostics
        if: always() && steps.apple-build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-macos-build-log
          path: ${{ runner.temp }}/macos-build.log
          retention-days: 3

      - name: Upload macOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/MonkeySSH.app
          compression-level: 0
          retention-days: 5

      - name: Save SwiftPM cache
        if: steps.spm-cache.outputs.swiftpm-hit != 'true'
        uses: ./.github/actions/apple-cache-save
        with:
          phase: swiftpm

  build-windows:
    name: Build Windows
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        shell: bash
        run: scripts/cache_sqlite3_native_assets.sh windows-x64

      - name: Test Windows usage RPC transport
        run: node --test test/scripts/agent_usage_windows_test.cjs

      - name: Test Windows usage launch and parallel probes
        run: flutter test --no-pub test/domain/services/agent_usage_windows_command_test.dart test/domain/services/agent_probe_parallel_test.dart

      - name: Test Windows agent command wrapping
        run: flutter test --no-pub test/domain/services/agent_management_service_test.dart --plain-name "full Windows probe executes through cmd and PowerShell"

      - name: Build Windows
        run: flutter build windows --release --no-tree-shake-icons

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          compression-level: 0
          retention-days: 5

  build-linux:
    name: Build Linux
    needs: [changes, monkeymux-assets]
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MonkeyMux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
          version: 1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache SQLite native asset
        run: scripts/cache_sqlite3_native_assets.sh linux-x64

      - name: Build Linux
        run: flutter build linux --release --no-tree-shake-icons

      - name: Upload Linux build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          compression-level: 0
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Gate job — the single required status check for branch protection.
  # Passes when checks/tests succeed and all triggered builds pass; correctly ignores
  # builds that were skipped because the platform was unchanged.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [changes, monkeymux-assets, check, tooling, test, terminal-test, go-test, build-android, build-ios, build-macos, build-windows, build-linux]
    runs-on: ubicloud-standard-4
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MONKEYMUX_ASSETS_RESULT: ${{ needs.monkeymux-assets.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TERMINAL_TEST_RESULT: ${{ needs.terminal-test.result }}
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          ok=true
          for name_result in \
            "changes:$CHANGES_RESULT" \
            "monkeymux-assets:$MONKEYMUX_ASSETS_RESULT" \
            "check:$CHECK_RESULT" \
            "tooling:$TOOLING_RESULT" \
            "test:$TEST_RESULT" \
            "terminal-test:$TERMINAL_TEST_RESULT" \
            "go-test:$GO_TEST_RESULT" \
            "build-android:$ANDROID_RESULT" \
            "build-ios:$IOS_RESULT" \
            "build-macos:$MACOS_RESULT" \
            "build-windows:$WINDOWS_RESULT" \
            "build-linux:$LINUX_RESULT"; do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            case "$result" in
              success|skipped)
                echo "✅ $name: $result"
                ;;
              *)
                echo "❌ $name: $result"
                ok=false
                ;;
            esac
          done
          if [ "$ok" = false ]; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
