name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Deployment channel'
        required: true
        type: choice
        default: production
        options:
          - production
          - internal
      ios:
        description: 'Release iOS'
        required: true
        type: boolean
        default: true
      android:
        description: 'Release Android'
        required: true
        type: boolean
        default: true
      version:
        description: 'Exact x.y.z version override (blank selects automatically)'
        required: false
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  compute-version:
    name: Compute Version
    # `store-assets` is a rolling prerelease that re-hosts regenerated store
    # media. Publishing it fires `release: published`, but it is not an app
    # release and its tag is not an x.y.z version, so skip the deploy entirely.
    if: >-
      github.event_name != 'release' ||
      github.event.release.tag_name != 'store-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
      build-codename: ${{ steps.version.outputs.build-codename }}
      build-display: ${{ steps.version.outputs.build-display }}
      channel: ${{ steps.version.outputs.channel }}
      release-ios: ${{ steps.version.outputs.release-ios }}
      release-android: ${{ steps.version.outputs.release-android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: github.event_name == 'release' || (inputs.channel == 'production' && inputs.ios)
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Test App Store version resolver
        if: github.event_name == 'release' || (inputs.channel == 'production' && inputs.ios)
        run: bundle exec ruby scripts/resolve_next_app_store_patch_version_test.rb

      - name: Compute version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_IOS: ${{ inputs.ios }}
          INPUT_ANDROID: ${{ inputs.android }}
          PREPARE_APP_STORE: ${{ github.event_name == 'release' || (inputs.channel == 'production' && inputs.ios) }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            CHANNEL=production
            RELEASE_IOS=true
            RELEASE_ANDROID=true
            REQUESTED_VERSION="${RELEASE_TAG#v}"
          else
            CHANNEL="$INPUT_CHANNEL"
            RELEASE_IOS="$INPUT_IOS"
            RELEASE_ANDROID="$INPUT_ANDROID"
            REQUESTED_VERSION="${INPUT_VERSION#v}"
          fi

          if [ "$RELEASE_IOS" != "true" ] && [ "$RELEASE_ANDROID" != "true" ]; then
            echo "::error title=No release platform selected::Select iOS, Android, or both."
            exit 1
          fi

          VERSION_LINE="$(grep '^version:' pubspec.yaml | head -n 1)"
          if [ -z "$VERSION_LINE" ]; then
            echo "::error title=Missing app version::Unable to determine version from pubspec.yaml."
            exit 1
          fi
          BASE_VERSION="$(printf '%s' "$VERSION_LINE" | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1 | xargs)"

          if [ "$PREPARE_APP_STORE" = "true" ]; then
            VERSION_OUTPUT="$RUNNER_TEMP/release-version"
            bundle exec ruby scripts/resolve_next_app_store_patch_version.rb \
              "$BASE_VERSION" \
              xyz.depollsoft.monkeyssh \
              "$VERSION_OUTPUT" \
              "$REQUESTED_VERSION" \
              resolve
            BUILD_NAME="$(cat "$VERSION_OUTPUT")"
          else
            BUILD_NAME="${REQUESTED_VERSION:-$BASE_VERSION}"
          fi

          if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release version::Version must use numeric x.y.z format; received '$BUILD_NAME'."
            exit 1
          fi

          BUILD_NUMBER=$(( $(date +%s) / 10 ))
          BUILD_CODENAME=$(python3 scripts/version_codename.py "$BUILD_NAME")
          BUILD_DISPLAY="$BUILD_NAME"
          if [ -n "$BUILD_CODENAME" ]; then
            BUILD_DISPLAY="$BUILD_NAME \"$BUILD_CODENAME\""
          fi

          echo "build-name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "build-number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build-codename=${BUILD_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "build-display=${BUILD_DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "release-ios=${RELEASE_IOS}" >> "$GITHUB_OUTPUT"
          echo "release-android=${RELEASE_ANDROID}" >> "$GITHUB_OUTPUT"
          echo "## Release Info" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${BUILD_DISPLAY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Number:** ${BUILD_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel:** ${CHANNEL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **iOS:** ${RELEASE_IOS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Android:** ${RELEASE_ANDROID}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build & Deploy Release
    needs: compute-version
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-name: ${{ needs.compute-version.outputs.build-name }}
      build-number: ${{ needs.compute-version.outputs.build-number }}
      build-codename: ${{ needs.compute-version.outputs.build-codename }}
      build-ios: ${{ needs.compute-version.outputs.release-ios == 'true' }}
      build-android: ${{ needs.compute-version.outputs.release-android == 'true' }}
      enable-diagnostics: ${{ needs.compute-version.outputs.channel == 'internal' }}
      flavor: production
      deploy-ios-to: ${{ needs.compute-version.outputs.release-ios == 'true' && (needs.compute-version.outputs.channel == 'production' && 'appstore' || 'testflight') || 'none' }}
      deploy-android-to: ${{ needs.compute-version.outputs.release-android == 'true' && (needs.compute-version.outputs.channel == 'production' && 'production' || 'internal') || 'none' }}
      sync-metadata: ${{ needs.compute-version.outputs.channel == 'production' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
      APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
      APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
      APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
      FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON }}
      FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON }}
      FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST }}
      FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST }}

  upload-release-artifacts:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compute-version, deploy]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-production-${{ needs.compute-version.outputs.build-name }}-${{ needs.compute-version.outputs.build-number }}
          path: artifacts/android

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-production-${{ needs.compute-version.outputs.build-name }}-${{ needs.compute-version.outputs.build-number }}.ipa
          path: artifacts/ios

      - name: Generate release checksums
        working-directory: artifacts
        run: shasum -a 256 android/*.aab ios/*.ipa > SHA256SUMS.txt

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/android/*.aab
            artifacts/ios/*.ipa
            artifacts/SHA256SUMS.txt
