name: PR Preview iOS
run-name: "iOS preview #${{ github.event.pull_request.number }} / ${{ github.event.pull_request.head.sha }} / ${{ github.event.pull_request.updated_at }}"

# Both platforms start on the same PR event and derive the same build number
# from that event's timestamp. Their workflow_run distribution consumers can
# proceed as soon as their own platform finishes.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'remote/monkeymux/**'
      - '!remote/monkeymux/**/*_test.go'
      - 'remote/monkeymux/conpty/**'
      - '!remote/monkeymux/README.md'
      - 'third_party/**'
      - 'android/**'
      - '!android/fastlane/metadata-*/**'
      - 'ios/**'
      - '!ios/fastlane/metadata-*/**'
      - 'scripts/build_monkeymux_assets.sh'
      - 'scripts/deterministic_gzip.go'
      - 'scripts/verify_monkeymux_assets.py'
      - 'scripts/android_signing.sh'
      - 'scripts/cache_sqlite3_native_assets.sh'
      - 'scripts/fetch_pr_commits.py'
      - 'scripts/version_codename.py'
      - 'scripts/preview_release_notes.rb'
      - 'scripts/preview_build_number.py'
      - 'scripts/store_metadata.rb'
      - 'scripts/match_git_persistence.rb'
      - 'scripts/testflight_delivery.rb'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/build-deploy.yml'
      - '.github/workflows/deploy-private.yml'
      - '.github/workflows/firebase-distribution.yml'
      - '.github/workflows/preview.yml'
      - '.github/workflows/preview-ios.yml'
      - '.github/actions/apple-cache-restore/**'
      - '.github/actions/apple-cache-save/**'
      - '.github/actions/compute-version/**'
      - '.github/actions/deployment-status/**'
      - '.github/actions/firebase-config/**'
      - '.github/actions/flutter-setup/**'

concurrency:
  group: preview-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  compute-version:
    name: Compute Version
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
      build-codename: ${{ steps.version.outputs.build-codename }}
      build-display: ${{ steps.version.outputs.build-display }}
    steps:
      # The workflow commit supplies the version action and its helpers; the PR
      # head supplies the version being built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          sparse-checkout: |
            pubspec.yaml
            scripts/version_codename.py
            assets/version_codenames.json
          sparse-checkout-cone-mode: false

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version
        with:
          source: source
          build-number: pull-request

  build-ios:
    name: Build iOS Preview
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.compute-version.result == 'success'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-name: ${{ needs.compute-version.outputs.build-name }}
      build-number: ${{ needs.compute-version.outputs.build-number }}
      build-codename: ${{ needs.compute-version.outputs.build-codename }}
      pr-number: ${{ github.event.pull_request.number }}
      pr-title: ${{ github.event.pull_request.title }}
      enable-diagnostics: true
      flavor: private
      source-ref: ${{ github.event.pull_request.head.sha }}
      deploy-ios-to: none
      deploy-android-to: none
      build-ios: true
      build-android: false
      build-ios-unsigned-ipa: true
    secrets:
      FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST }}

  comment-ios:
    name: PR Comment (iOS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compute-version, build-ios]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && needs.compute-version.result == 'success'
    permissions:
      issues: write
      actions: read
      pull-requests: write
    steps:
      - name: Resolve iOS status
        id: ios-status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const result = '${{ needs.build-ios.result }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = {
              success: '✅ Built',
              failure: '❌ Failed',
              cancelled: '⛔ Cancelled',
              skipped: '⏭️ Skipped',
            };
            core.setOutput('status', statuses[result] ?? `⏳ ${result}`);
            core.setOutput('run-url', runUrl);

      - name: Comment iOS status on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-build-ios
          number: ${{ github.event.pull_request.number }}
          recreate: true
          message: |
            ## 🍎 iOS Preview Build

            | | Details |
            |---|---|
            | **Version** | `${{ needs.compute-version.outputs.build-name }}` (build `${{ needs.compute-version.outputs.build-number }}`) |
            | **iOS Status** | ${{ steps.ios-status.outputs.status }} |
            | **Run** | [View iOS build run](${{ steps.ios-status.outputs.run-url }}) |

            iOS installs become available after a `/deploy` PR preview deploy.

            > Built from ${{ github.event.pull_request.head.sha }}
