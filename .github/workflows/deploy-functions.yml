name: Deploy Functions

# Deploys the push Cloud Functions (functions/, docs/push-notifications.md) to
# the monkeyssh Firebase project whenever main changes them. CI's
# functions-test job already gates the merge; this run tests again on the
# exact commit it deploys.
#
# Authentication is keyless: GitHub's OIDC token is exchanged through the
# `github` Workload Identity pool for the functions-deployer service account.
# The pool's provider only accepts this repository, refs/heads/main and this
# workflow file, so a branch or another workflow cannot deploy. The functions
# run as push-functions@, not the default compute account. The
# PUSH_TICKET_KEYS secret is created once by hand and never passes through CI.

on:
  push:
    branches: [main]
    # Keep in sync with FUNCTIONS_PATHS in scripts/ci_changes.py; the
    # regression test checks the two lists match.
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# Never cancel a deploy half-way; a newer push waits and deploys after it.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloud Functions
    if: github.ref == 'refs/heads/main'
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and test
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/529923319565/locations/global/workloadIdentityPools/github/providers/monkeyssh-functions
          service_account: functions-deployer@monkeyssh.iam.gserviceaccount.com

      # --force applies the source as the truth: it removes functions that no
      # longer exist and sets the container image cleanup policy without a
      # prompt.
      - name: Deploy
        run: npx --yes firebase-tools@15.28.1 deploy --only functions --project monkeyssh --non-interactive --force
