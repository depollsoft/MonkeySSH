name: Build & Deploy

on:
  workflow_call:
    inputs:
      build-name:
        required: true
        type: string
        description: 'Version name (e.g., 0.1.0-pr.42 or 1.2.0)'
      build-number:
        required: true
        type: string
        description: 'Build number (integer, monotonically increasing)'
      build-codename:
        required: false
        type: string
        default: ''
        description: 'Monkey codename for the current major version'
      pr-number:
        required: false
        type: string
        default: ''
        description: 'Pull request number for preview-derived builds'
      pr-title:
        required: false
        type: string
        default: ''
        description: 'Pull request title for preview-derived builds'
      enable-diagnostics:
        required: false
        type: boolean
        default: false
        description: 'Whether to enable copyable in-app diagnostics logging'
      flavor:
        required: true
        type: string
        description: 'Flutter flavor (private or production)'
      source-ref:
        required: false
        type: string
        default: ''
        description: 'Git ref to build (branch, tag, or refs/pull/*/head)'
      deploy-ios-to:
        required: false
        type: string
        default: 'none'
        description: 'iOS deploy target: testflight, appstore, or none'
      deploy-android-to:
        required: false
        type: string
        default: 'none'
        description: 'Android deploy target: internal, production, or none'
      build-android:
        required: false
        type: boolean
        default: true
        description: 'Whether to run the Android build job'
      android-runner:
        required: false
        type: string
        default: 'ubicloud-standard-4'
        description: 'Runner label for the Android build job'
      build-ios:
        required: false
        type: boolean
        default: true
        description: 'Whether to run the iOS build job'
      build-android-unsigned-aab:
        required: false
        type: boolean
        default: false
        description: 'Whether to build an unsigned Android release bundle artifact'
      build-android-apk:
        required: false
        type: boolean
        default: true
        description: 'Whether to derive and upload a universal Android APK artifact from the preview AAB when deploy-android-to == none'
      android-target-platform:
        required: false
        type: string
        default: ''
        description: 'Optional Flutter Android target platform override, e.g. android-arm64 for fast non-deploy preview builds'
      build-ios-unsigned-ipa:
        required: false
        type: boolean
        default: false
        description: 'Whether to package an unsigned iOS IPA artifact'
      run-android-deploy:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload Android artifacts to Play when deploy-android-to != none'
      run-ios-deploy:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload iOS artifacts to App Store Connect when deploy-ios-to != none'
      update-pr-deploy-comment:
        required: false
        type: boolean
        default: false
        description: 'Whether to update the preview deploy PR comment as each platform finishes'
      android-reuse-run-id:
        required: false
        type: string
        default: ''
        description: 'Workflow run ID containing reusable Android artifacts'
      android-reuse-aab-artifact-name:
        required: false
        type: string
        default: ''
        description: 'Artifact name for a reusable Android AAB'
      android-reuse-apk-artifact-name:
        required: false
        type: string
        default: ''
        description: 'Artifact name for a reusable Android APK'
      android-reuse-aab-is-unsigned:
        required: false
        type: boolean
        default: false
        description: 'Whether the reusable Android AAB must be signed in this workflow'
      android-reuse-source-sha:
        required: false
        type: string
        default: ''
        description: 'Source SHA associated with the reusable Android artifacts'
      ios-reuse-run-id:
        required: false
        type: string
        default: ''
        description: 'Workflow run ID containing a reusable iOS IPA'
      ios-reuse-ipa-artifact-name:
        required: false
        type: string
        default: ''
        description: 'Artifact name for a reusable iOS IPA'
      ios-reuse-ipa-is-unsigned:
        required: false
        type: boolean
        default: false
        description: 'Whether the reusable iOS IPA must be signed in this workflow'
      ios-reuse-source-sha:
        required: false
        type: string
        default: ''
        description: 'Source SHA associated with the reusable iOS IPA'
      sync-metadata:
        required: false
        type: boolean
        default: false
        description: 'Whether to sync store metadata alongside the deploy'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        required: false
      MATCH_GIT_URL:
        required: false
      MATCH_PASSWORD:
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_CONTENT:
        required: false
      APP_REVIEW_CONTACT_FIRST_NAME:
        required: false
      APP_REVIEW_CONTACT_LAST_NAME:
        required: false
      APP_REVIEW_CONTACT_EMAIL:
        required: false
      APP_REVIEW_CONTACT_PHONE:
        required: false
      FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON:
        required: false
      FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON:
        required: false
      FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST:
        required: false
      FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST:
        required: false
    outputs:
      apk-artifact-id:
        description: 'Artifact ID of the uploaded APK'
        value: ${{ jobs.build-android.outputs.apk-artifact-id }}
      android-source-sha:
        description: 'Git SHA used for Android build checkout'
        value: ${{ jobs.build-android.outputs.source-sha }}
      ios-source-sha:
        description: 'Git SHA used for iOS build checkout'
        value: ${{ jobs.build-ios.outputs.source-sha }}
      android-deploy-status:
        description: 'Final Android deploy status summary for preview deploy comments'
        value: ${{ jobs.deploy-status-summary.outputs.android-deploy-status }}
      ios-deploy-status:
        description: 'Final iOS deploy status summary for preview deploy comments'
        value: ${{ jobs.deploy-status-summary.outputs.ios-deploy-status }}

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  validate-build-inputs:
    name: Validate Build Inputs
    runs-on: ubuntu-latest
    env:
      BUILD_FLAVOR: ${{ inputs.flavor }}
      BUILD_NAME: ${{ inputs.build-name }}
      BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - name: Validate version and flavor
        run: |
          if [[ "$BUILD_FLAVOR" != 'private' && "$BUILD_FLAVOR" != 'production' ]]; then
            echo "::error title=Invalid flavor::Flavor must be private or production."
            exit 1
          fi
          if [[ ! "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error title=Invalid build name::Expected a semantic version such as 1.2.3 or 1.2.3-pr.42."
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] ||
             (( BUILD_NUMBER > 2147483647 )); then
            echo "::error title=Invalid build number::Expected a positive Android-compatible build number."
            exit 1
          fi

  # Source builds need the six ignored MonkeyMux payloads. Build them once for
  # the requested source ref and share the exact bytes between Android and iOS.
  # Keep this job successful when every requested platform reuses an existing
  # package artifact so dependent deploy jobs are not skipped.
  monkeymux-assets:
    name: Build MonkeyMux Assets
    needs: validate-build-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.source-sha.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Resolve source SHA
        id: source-sha
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          if echo "$REQUESTED_SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            source_sha="$REQUESTED_SOURCE_REF"
          elif [ -n "$REQUESTED_SOURCE_REF" ]; then
            git fetch --no-tags --depth=1 origin -- "$REQUESTED_SOURCE_REF"
            source_sha="$(git rev-parse FETCH_HEAD)"
          else
            source_sha="$(git rev-parse HEAD)"
          fi
          echo "value=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout resolved source SHA
        if: (inputs.build-android && inputs.android-reuse-aab-artifact-name == '') || (inputs.build-ios && inputs.ios-reuse-ipa-artifact-name == '')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source-sha.outputs.value }}
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: (inputs.build-android && inputs.android-reuse-aab-artifact-name == '') || (inputs.build-ios && inputs.ios-reuse-ipa-artifact-name == '')
        with:
          go-version-file: remote/monkeymux/go.mod
          cache-dependency-path: remote/monkeymux/go.sum

      - name: Build assets
        if: (inputs.build-android && inputs.android-reuse-aab-artifact-name == '') || (inputs.build-ios && inputs.ios-reuse-ipa-artifact-name == '')
        run: |
          if [ -x scripts/ensure_monkeymux_assets.sh ]; then
            scripts/ensure_monkeymux_assets.sh
          else
            # Existing PR heads created before asset generation moved out of
            # Git have the original builder but not the new ensure wrapper.
            scripts/build_monkeymux_assets.sh
          fi

      - name: Upload assets
        if: (inputs.build-android && inputs.android-reuse-aab-artifact-name == '') || (inputs.build-ios && inputs.ios-reuse-ipa-artifact-name == '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monkeymux-assets
          path: assets/monkeymux/
          compression-level: 0
          retention-days: 1

  build-android:
    name: Build & Deploy Android (${{ inputs.flavor }})
    needs: [validate-build-inputs, monkeymux-assets]
    if: inputs.build-android
    runs-on: ${{ inputs.android-runner }}
    env:
      BUILD_FLAVOR: ${{ inputs.flavor }}
      BUILD_NAME: ${{ inputs.build-name }}
      BUILD_NUMBER: ${{ inputs.build-number }}
      FLUTTY_PR_NUMBER: ${{ inputs.pr-number }}
      FLUTTY_PR_TITLE: ${{ inputs.pr-title }}
      FLUTTY_DIAGNOSTICS_ENABLED: ${{ inputs.enable-diagnostics || inputs.pr-number != '' }}
      FLUTTY_FIREBASE_ENABLED: 'false'
    outputs:
      apk-artifact-id: ${{ steps.upload-apk.outputs.artifact-id }}
      source-sha: ${{ steps.resolved-source-sha.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Capture source SHA
        id: source-sha
        env:
          REUSED_SOURCE_SHA: ${{ inputs.android-reuse-source-sha }}
          BUILT_SOURCE_SHA: ${{ needs.monkeymux-assets.outputs.source-sha }}
        run: |
          if [ -n "$REUSED_SOURCE_SHA" ]; then
            echo "value=$REUSED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUILT_SOURCE_SHA" ]; then
            echo "value=$BUILT_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Missing source SHA::MonkeyMux asset generation did not resolve a source commit."
            exit 1
          fi

      - name: Resolve source SHA
        id: resolved-source-sha
        env:
          REUSED_SOURCE_SHA: ${{ inputs.android-reuse-source-sha }}
          CHECKED_OUT_SOURCE_SHA: ${{ steps.source-sha.outputs.value }}
        run: |
          if [ -n "$REUSED_SOURCE_SHA" ]; then
            echo "value=$REUSED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "value=$CHECKED_OUT_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout resolved source SHA for Android build
        if: inputs.android-reuse-aab-artifact-name == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source-sha.outputs.value }}
          fetch-depth: 1

      - name: Download MonkeyMux assets
        if: inputs.android-reuse-aab-artifact-name == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: inputs.android-reuse-aab-artifact-name == '' || (inputs.deploy-android-to != 'none' && inputs.android-reuse-aab-is-unsigned)
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: inputs.android-reuse-aab-artifact-name == ''
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          add-job-summary: on-failure

      - name: Configure CI Gradle properties
        if: inputs.android-reuse-aab-artifact-name == ''
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
          } >> ~/.gradle/gradle.properties

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: inputs.android-reuse-aab-artifact-name == ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: inputs.android-reuse-aab-artifact-name == ''
        run: flutter pub get

      - name: Cache SQLite native asset
        if: inputs.android-reuse-aab-artifact-name == ''
        run: |
          scripts/cache_sqlite3_native_assets.sh \
            android-arm64 android-x64 android-arm android-ia32

      - name: Configure Firebase for Android
        if: inputs.android-reuse-aab-artifact-name == ''
        env:
          FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON }}
          FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ "${{ inputs.flavor }}" = "private" ]; then
            GOOGLE_SERVICES_JSON="$FIREBASE_ANDROID_PRIVATE_GOOGLE_SERVICES_JSON"
          else
            GOOGLE_SERVICES_JSON="$FIREBASE_ANDROID_PRODUCTION_GOOGLE_SERVICES_JSON"
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            if [ "${{ inputs.deploy-android-to }}" != "none" ]; then
              echo "::error title=Missing Firebase Android config::Firebase Analytics must be enabled for deployed Android release builds. Configure the FIREBASE_ANDROID_${{ inputs.flavor == 'private' && 'PRIVATE' || 'PRODUCTION' }}_GOOGLE_SERVICES_JSON secret."
              exit 1
            fi
            echo "FLUTTY_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "android/app/src/${{ inputs.flavor }}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "android/app/src/${{ inputs.flavor }}/google-services.json"
          echo "FLUTTY_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Resolve Android SDK path
        id: android-sdk
        if: inputs.android-reuse-aab-artifact-name == ''
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "::error title=Missing Android SDK::ANDROID_HOME or ANDROID_SDK_ROOT must be set."
            exit 1
          fi
          echo "path=$ANDROID_SDK" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: inputs.android-reuse-aab-artifact-name == ''
        with:
          path: ${{ steps.android-sdk.outputs.path }}/cmake/3.22.1
          key: android-cmake-${{ runner.os }}-3.22.1

      - name: Install Android CMake
        if: inputs.android-reuse-aab-artifact-name == ''
        env:
          ANDROID_SDK: ${{ steps.android-sdk.outputs.path }}
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_SDK/cmake/3.22.1/bin/cmake" ]; then
            exit 0
          fi
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_SDK" -path '*/bin/sdkmanager' -type f -perm -111 \
                | head -n 1
            )"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=Missing sdkmanager::Could not find sdkmanager under the Android SDK."
            exit 1
          fi
          rm -rf "$ANDROID_SDK/cmake/3.22.1"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          yes | "$SDKMANAGER" --install 'cmake;3.22.1'
          set -o pipefail

      - name: Validate Android signing secrets
        if: inputs.deploy-android-to != 'none' && (inputs.android-reuse-aab-artifact-name == '' || inputs.android-reuse-aab-is-unsigned)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=Missing Android signing secret::ANDROID_KEYSTORE_BASE64 is required for Android release signing."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error title=Missing Android signing secret::ANDROID_KEY_ALIAS is required for Android release signing."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error title=Missing Android signing secret::ANDROID_KEY_PASSWORD is required for Android release signing."
            exit 1
          fi
          if [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error title=Missing Android signing secret::ANDROID_STORE_PASSWORD is required for Android release signing."
            exit 1
          fi

      - name: Decode keystore
        if: inputs.deploy-android-to != 'none' && (inputs.android-reuse-aab-artifact-name == '' || inputs.android-reuse-aab-is-unsigned)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: inputs.deploy-android-to != 'none' && inputs.android-reuse-aab-artifact-name == ''
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          umask 077
          cat > android/app/key.properties << EOF_KEY_PROPERTIES
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF_KEY_PROPERTIES

      - name: Build signed AAB
        if: inputs.deploy-android-to != 'none' && inputs.android-reuse-aab-artifact-name == ''
        env:
          ANDROID_TARGET_PLATFORM: ${{ inputs.android-target-platform }}
        run: |
          EXTRA_ANDROID_FLAGS=()
          if [ -n "$ANDROID_TARGET_PLATFORM" ]; then
            EXTRA_ANDROID_FLAGS+=(--target-platform="$ANDROID_TARGET_PLATFORM")
          fi
          flutter build appbundle \
            --flavor "$BUILD_FLAVOR" \
            --release \
            "${EXTRA_ANDROID_FLAGS[@]}" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=FLUTTY_PR_NUMBER="$FLUTTY_PR_NUMBER" \
            --dart-define=FLUTTY_PR_TITLE="$FLUTTY_PR_TITLE" \
            --dart-define=FLUTTY_DIAGNOSTICS_ENABLED="$FLUTTY_DIAGNOSTICS_ENABLED" \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Verify AD_ID permission in AAB
        if: inputs.deploy-android-to != 'none' && inputs.android-reuse-aab-artifact-name == ''
        env:
          AAB_PATH: build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab
        run: |
          set -euo pipefail
          MANIFEST_STRINGS="$(
            unzip -p "$AAB_PATH" base/manifest/AndroidManifest.xml | strings
          )"
          if [[ "$MANIFEST_STRINGS" != *'com.google.android.gms.permission.AD_ID'* ]]; then
            echo "::error title=Missing AD_ID permission::The signed Android App Bundle does not declare com.google.android.gms.permission.AD_ID."
            exit 1
          fi

      - name: Build unsigned AAB
        if: inputs.build-android-unsigned-aab && inputs.android-reuse-aab-artifact-name == '' && inputs.deploy-android-to == 'none'
        env:
          ANDROID_TARGET_PLATFORM: ${{ inputs.android-target-platform }}
          FLUTTY_ALLOW_UNSIGNED_RELEASE: 'true'
        run: |
          EXTRA_ANDROID_FLAGS=()
          if [ -n "$ANDROID_TARGET_PLATFORM" ]; then
            EXTRA_ANDROID_FLAGS+=(--target-platform="$ANDROID_TARGET_PLATFORM")
          fi
          flutter build appbundle \
            --flavor "$BUILD_FLAVOR" \
            --release \
            --no-tree-shake-icons \
            "${EXTRA_ANDROID_FLAGS[@]}" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=FLUTTY_PR_NUMBER="$FLUTTY_PR_NUMBER" \
            --dart-define=FLUTTY_PR_TITLE="$FLUTTY_PR_TITLE" \
            --dart-define=FLUTTY_DIAGNOSTICS_ENABLED="$FLUTTY_DIAGNOSTICS_ENABLED" \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Build debug AAB for preview artifacts
        if: inputs.build-android-apk && inputs.deploy-android-to == 'none' && !inputs.build-android-unsigned-aab
        env:
          ANDROID_TARGET_PLATFORM: ${{ inputs.android-target-platform }}
        run: |
          EXTRA_ANDROID_FLAGS=()
          if [ -n "$ANDROID_TARGET_PLATFORM" ]; then
            EXTRA_ANDROID_FLAGS+=(--target-platform="$ANDROID_TARGET_PLATFORM")
          fi
          flutter build appbundle \
            --flavor "$BUILD_FLAVOR" \
            --debug \
            --no-tree-shake-icons \
            "${EXTRA_ANDROID_FLAGS[@]}" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=FLUTTY_PR_NUMBER="$FLUTTY_PR_NUMBER" \
            --dart-define=FLUTTY_PR_TITLE="$FLUTTY_PR_TITLE" \
            --dart-define=FLUTTY_DIAGNOSTICS_ENABLED="$FLUTTY_DIAGNOSTICS_ENABLED" \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Prepare AAB for preview install artifacts
        id: preview-aab
        if: inputs.build-android-apk && inputs.deploy-android-to == 'none'
        run: |
          set -euo pipefail

          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ "${{ inputs.build-android-unsigned-aab }}" = "true" ]; then
            UNSIGNED_AAB_PATH="build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab"
            PREVIEW_AAB_PATH="$RUNNER_TEMP/app-${{ inputs.flavor }}-release-preview-signed.aab"
            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -keypass android \
              -signedjar "$PREVIEW_AAB_PATH" \
              "$UNSIGNED_AAB_PATH" \
              androiddebugkey
            jarsigner -verify "$PREVIEW_AAB_PATH"
          else
            PREVIEW_AAB_PATH="$GITHUB_WORKSPACE/build/app/outputs/bundle/${{ inputs.flavor }}Debug/app-${{ inputs.flavor }}-debug.aab"
          fi

          echo "path=$PREVIEW_AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate APK artifact from preview AAB
        if: inputs.build-android-apk && inputs.deploy-android-to == 'none'
        env:
          BUNDLETOOL_VERSION: '1.18.3'
        run: |
          set -euo pipefail

          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          AAB_PATH="${{ steps.preview-aab.outputs.path }}"
          APKS_PATH="$RUNNER_TEMP/app-${{ inputs.flavor }}-preview.apks"
          APK_DIR="$RUNNER_TEMP/app-${{ inputs.flavor }}-preview-apks"
          APK_PATH="build/app/outputs/flutter-apk/android-apk-${BUILD_FLAVOR}-${BUILD_NAME}-${BUILD_NUMBER}.apk"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$BUNDLETOOL_JAR" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          java -jar "$BUNDLETOOL_JAR" build-apks \
            --bundle="$AAB_PATH" \
            --output="$APKS_PATH" \
            --mode=universal \
            --ks="$DEBUG_KEYSTORE" \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android \
            --overwrite

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR" "$(dirname "$APK_PATH")"
          unzip -q "$APKS_PATH" universal.apk -d "$APK_DIR"
          mv "$APK_DIR/universal.apk" "$APK_PATH"

      - name: Download reusable AAB artifact
        if: inputs.android-reuse-aab-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android-reuse-run-id }}
          name: ${{ inputs.android-reuse-aab-artifact-name }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release

      - name: Download reusable APK artifact
        if: inputs.android-reuse-apk-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android-reuse-run-id }}
          name: ${{ inputs.android-reuse-apk-artifact-name }}
          path: build/app/outputs/flutter-apk

      - name: Sign reusable unsigned AAB
        if: inputs.deploy-android-to != 'none' && inputs.android-reuse-aab-artifact-name != '' && inputs.android-reuse-aab-is-unsigned
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          AAB_PATH=$(find build/app/outputs/bundle/${{ inputs.flavor }}Release -maxdepth 1 -name '*.aab' -print -quit)
          if [ -z "$AAB_PATH" ]; then
            echo "Expected a reusable unsigned AAB artifact, but none was downloaded."
            exit 1
          fi

          SIGNED_AAB_PATH="$(dirname "$AAB_PATH")/signed-$(basename "$AAB_PATH")"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$SIGNED_AAB_PATH" \
            "$AAB_PATH" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$SIGNED_AAB_PATH"
          mv "$SIGNED_AAB_PATH" "$AAB_PATH"

      - name: Upload signed AAB artifact
        if: inputs.deploy-android-to != 'none' && inputs.android-reuse-aab-artifact-name == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-${{ inputs.flavor }}-${{ inputs.build-name }}-${{ inputs.build-number }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab

      - name: Upload unsigned AAB artifact
        if: inputs.build-android-unsigned-aab && inputs.android-reuse-aab-artifact-name == '' && inputs.deploy-android-to == 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unsigned-${{ inputs.flavor }}-${{ inputs.build-name }}-${{ inputs.build-number }}${{ inputs.android-target-platform != '' && format('-{0}', inputs.android-target-platform) || '' }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab

      - name: Upload APK artifact
        id: upload-apk
        if: inputs.build-android-apk && inputs.deploy-android-to == 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/app/outputs/flutter-apk/android-apk-${{ inputs.flavor }}-${{ inputs.build-name }}-${{ inputs.build-number }}.apk
          archive: false

      - name: Fetch PR commits
        if: inputs.pr-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          python3 << 'SCRIPT'
          import json, os, sys, uuid, urllib.request

          try:
              token = os.environ['GH_TOKEN']
              repo = os.environ['GITHUB_REPOSITORY']
              pr = os.environ['PR_NUMBER']
              base_url = f'https://api.github.com/repos/{repo}/pulls/{pr}/commits'
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
              }
              commits = []
              page = 1
              max_commits = 100
              while True:
                  url = f'{base_url}?per_page=100&page={page}'
                  req = urllib.request.Request(url, headers=headers)
                  data = json.loads(urllib.request.urlopen(req).read())
                  if not data:
                      break
                  commits.extend(data)
                  if len(data) < 100 or len(commits) >= max_commits:
                      break
                  page += 1
              commits = commits[:max_commits]
              lines = []
              for c in reversed(commits):
                  sha = c['sha'][:7]
                  msg = c['commit']['message'].split('\n')[0]
                  lines.append(f'{sha} {msg}')
              delim = f'FLUTTY_EOF_{uuid.uuid4().hex}'
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'FLUTTY_PR_COMMITS<<{delim}\n')
                  f.write('\n'.join(lines))
                  f.write(f'\n{delim}\n')
          except Exception as e:
              print(f'Warning: failed to fetch PR commits: {e}', file=sys.stderr)
          SCRIPT

      - name: Start Android GitHub deployment
        id: start-android-deployment
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_REF: ${{ steps.resolved-source-sha.outputs.value }}
          DEPLOYMENT_ENVIRONMENT: Android ${{ inputs.flavor == 'private' && 'Private' || 'Production' }} / Play ${{ inputs.deploy-android-to == 'production' && 'Production' || 'Internal' }}
          DEPLOYMENT_DESCRIPTION: Android ${{ inputs.flavor }} ${{ inputs.build-name }} (${{ inputs.build-number }}) to Play ${{ inputs.deploy-android-to }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ inputs.deploy-android-to == 'production' && 'https://play.google.com/store/apps/details?id=xyz.depollsoft.monkeyssh' || '' }}
          DEPLOYMENT_PRODUCTION_ENVIRONMENT: ${{ inputs.deploy-android-to == 'production' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environmentUrl = process.env.DEPLOYMENT_ENVIRONMENT_URL || '';
            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: process.env.DEPLOYMENT_REF,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: process.env.DEPLOYMENT_DESCRIPTION,
              required_contexts: [],
              auto_merge: false,
              production_environment: process.env.DEPLOYMENT_PRODUCTION_ENVIRONMENT === 'true',
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Android Play upload started.',
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              auto_inactive: false,
              ...(environmentUrl ? {environment_url: environmentUrl} : {}),
            });
            core.setOutput('deployment-id', String(deployment.data.id));

      - name: Validate Play Store service account
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Missing Play Store service account::PLAY_STORE_SERVICE_ACCOUNT_JSON is required for Android Play uploads."
            exit 1
          fi

      - name: Setup Ruby for Play deployment
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download published store assets
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy && inputs.sync-metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/store_assets.sh
          scripts/store_assets.sh download

      - name: Refresh Play Store icon metadata
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy && inputs.sync-metadata
        run: |
          python -m pip install --quiet Pillow
          python scripts/sync_play_store_icons.py

      - name: Validate Play Store metadata
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy && inputs.sync-metadata
        run: |
          python3 scripts/validate_play_store_metadata.py ${{ inputs.flavor }}

      - name: Run Fastlane
        id: android-deploy
        if: inputs.deploy-android-to != 'none' && inputs.run-android-deploy
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          AAB_PATH: ../build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab
          ANDROID_VERSION_CODE: ${{ inputs.build-number }}
          FLUTTY_BUILD_NAME: ${{ inputs.build-name }}
          FLUTTY_VERSION_CODENAME: ${{ inputs.build-codename }}
          FLUTTY_SOURCE_SHA: ${{ steps.resolved-source-sha.outputs.value }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd android
          SKIP_META=${{ inputs.sync-metadata && 'false' || 'true' }}
          PACKAGE_NAME="${{ inputs.flavor == 'private' && 'xyz.depollsoft.monkeyssh.private' || 'xyz.depollsoft.monkeyssh' }}"
          if [ "${{ inputs.deploy-android-to }}" = "internal" ]; then
            bundle exec fastlane internal package_name:"$PACKAGE_NAME" skip_metadata:"$SKIP_META" version_code:"$ANDROID_VERSION_CODE"
          elif [ "${{ inputs.deploy-android-to }}" = "production" ]; then
            bundle exec fastlane release skip_metadata:"$SKIP_META" version_code:"$ANDROID_VERSION_CODE"
          fi

      - name: Finish Android GitHub deployment
        if: always() && inputs.deploy-android-to != 'none' && inputs.run-android-deploy && steps.start-android-deployment.outputs['deployment-id'] != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ID: ${{ steps.start-android-deployment.outputs['deployment-id'] }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ inputs.deploy-android-to == 'production' && 'https://play.google.com/store/apps/details?id=xyz.depollsoft.monkeyssh' || '' }}
          DEPLOYMENT_STATE: ${{ steps.android-deploy.outcome == 'success' && 'success' || 'failure' }}
          DEPLOYMENT_DESCRIPTION: ${{ steps.android-deploy.outcome == 'success' && 'Android Play upload completed.' || 'Android Play upload failed.' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environmentUrl = process.env.DEPLOYMENT_ENVIRONMENT_URL || '';
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOYMENT_STATE,
              description: process.env.DEPLOYMENT_DESCRIPTION,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              auto_inactive: process.env.DEPLOYMENT_STATE === 'success',
              ...(environmentUrl ? {environment_url: environmentUrl} : {}),
            });

      - name: Remove Android signing material
        if: always() && inputs.deploy-android-to != 'none' && (inputs.android-reuse-aab-artifact-name == '' || inputs.android-reuse-aab-is-unsigned)
        run: rm -f android/app/upload-keystore.jks android/app/key.properties

  build-ios:
    name: Build & Deploy iOS (${{ inputs.flavor }})
    needs: [validate-build-inputs, monkeymux-assets]
    if: inputs.build-ios
    runs-on: macos-26
    env:
      BUILD_FLAVOR: ${{ inputs.flavor }}
      BUILD_NAME: ${{ inputs.build-name }}
      BUILD_NUMBER: ${{ inputs.build-number }}
      # Keep release validation on the runner Xcode that includes the installed
      # iOS simulator runtime. Newer side-by-side Xcodes can drift ahead of the
      # available runtime and fail builds before Flutter starts.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      FLUTTY_PR_NUMBER: ${{ inputs.pr-number }}
      FLUTTY_PR_TITLE: ${{ inputs.pr-title }}
      FLUTTY_DIAGNOSTICS_ENABLED: ${{ inputs.enable-diagnostics || inputs.pr-number != '' }}
      FLUTTY_FIREBASE_ENABLED: 'false'
    outputs:
      source-sha: ${{ steps.resolved-source-sha.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Capture source SHA
        id: source-sha
        env:
          REUSED_SOURCE_SHA: ${{ inputs.ios-reuse-source-sha }}
          BUILT_SOURCE_SHA: ${{ needs.monkeymux-assets.outputs.source-sha }}
        run: |
          if [ -n "$REUSED_SOURCE_SHA" ]; then
            echo "value=$REUSED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUILT_SOURCE_SHA" ]; then
            echo "value=$BUILT_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Missing source SHA::MonkeyMux asset generation did not resolve a source commit."
            exit 1
          fi

      - name: Resolve source SHA
        id: resolved-source-sha
        env:
          REUSED_SOURCE_SHA: ${{ inputs.ios-reuse-source-sha }}
          CHECKED_OUT_SOURCE_SHA: ${{ steps.source-sha.outputs.value }}
        run: |
          if [ -n "$REUSED_SOURCE_SHA" ]; then
            echo "value=$REUSED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "value=$CHECKED_OUT_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout resolved source SHA for iOS build
        if: inputs.ios-reuse-ipa-artifact-name == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source-sha.outputs.value }}
          fetch-depth: 1

      - name: Download MonkeyMux assets
        if: inputs.ios-reuse-ipa-artifact-name == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monkeymux-assets
          path: assets/monkeymux/

      # Restore only; CI's push-to-main run is the sole writer in this repository.
      # GitHub scopes caches per ref, so writing here would store a ~440MB copy
      # per PR ref against a shared 10GB budget and evict the ~2GB Flutter SDK
      # caches. The restore-keys prefix means a deploy whose Package.resolved
      # has moved still starts from main's copy and resolves the delta.
      #
      # The entry is shared with the macOS job: SwiftPM keys its cache on package
      # identity, not platform, and the binary artifact bundles carry every
      # platform slice. Hashing both Package.resolved files means either one
      # moving invalidates it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: inputs.ios-reuse-ipa-artifact-name == ''
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Drop cached SwiftPM manifest evaluations
        # permission_handler_apple's Package.swift derives its PERMISSION_*
        # macros from the app's Info.plist, which SwiftPM does not track as a
        # manifest input, so a restored manifest cache can keep stale
        # permissions compiled in after a usage-description change. Delete it
        # after restore rather than excluding it from the cache: actions/cache
        # exclusion patterns silently did not match here, and re-evaluating a
        # handful of manifests costs seconds.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/manifests

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: inputs.ios-reuse-ipa-artifact-name == ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        if: inputs.ios-reuse-ipa-artifact-name == ''
        run: flutter pub get

      - name: Cache SQLite native asset
        if: inputs.ios-reuse-ipa-artifact-name == ''
        run: scripts/cache_sqlite3_native_assets.sh ios-arm64

      - name: Configure Firebase for iOS
        if: inputs.ios-reuse-ipa-artifact-name == ''
        env:
          FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ "${{ inputs.flavor }}" = "private" ]; then
            GOOGLE_SERVICE_INFO_PLIST="$FIREBASE_IOS_PRIVATE_GOOGLE_SERVICE_INFO_PLIST"
          else
            GOOGLE_SERVICE_INFO_PLIST="$FIREBASE_IOS_PRODUCTION_GOOGLE_SERVICE_INFO_PLIST"
          fi
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            if [ "${{ inputs.deploy-ios-to }}" != "none" ]; then
              echo "::error title=Missing Firebase iOS config::Firebase Analytics must be enabled for deployed iOS release builds. Configure the FIREBASE_IOS_${{ inputs.flavor == 'private' && 'PRIVATE' || 'PRODUCTION' }}_GOOGLE_SERVICE_INFO_PLIST secret."
              exit 1
            fi
            echo "FLUTTY_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "ios/Runner/Firebase/${{ inputs.flavor }}"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "ios/Runner/Firebase/${{ inputs.flavor }}/GoogleService-Info.plist"
          echo "FLUTTY_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Setup code signing
        if: inputs.deploy-ios-to != 'none' && (inputs.ios-reuse-ipa-artifact-name == '' || inputs.ios-reuse-ipa-is-unsigned)
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd ios
          if [ "${{ inputs.flavor }}" = "private" ]; then
            bundle exec fastlane setup_signing app_identifier:xyz.depollsoft.monkeyssh.private
          else
            bundle exec fastlane setup_signing app_identifier:xyz.depollsoft.monkeyssh
          fi

      - name: Build or configure iOS
        if: inputs.ios-reuse-ipa-artifact-name == ''
        env:
          DEPLOY_IOS_TO: ${{ inputs.deploy-ios-to }}
        run: |
          EXTRA_FLAGS=()
          if [ "$DEPLOY_IOS_TO" = "none" ]; then
            EXTRA_FLAGS+=(--no-tree-shake-icons)
          else
            # Fastlane archives deploy builds below. Generate its Xcode
            # configuration without compiling the application a second time.
            EXTRA_FLAGS+=(--config-only)
          fi
          flutter build ios \
            --flavor "$BUILD_FLAVOR" \
            --release \
            --no-codesign \
            "${EXTRA_FLAGS[@]}" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=FLUTTY_PR_NUMBER="$FLUTTY_PR_NUMBER" \
            --dart-define=FLUTTY_PR_TITLE="$FLUTTY_PR_TITLE" \
            --dart-define=FLUTTY_DIAGNOSTICS_ENABLED="$FLUTTY_DIAGNOSTICS_ENABLED" \
            --dart-define=FLUTTY_FIREBASE_ENABLED="$FLUTTY_FIREBASE_ENABLED"

      - name: Package unsigned IPA
        if: inputs.build-ios-unsigned-ipa && inputs.ios-reuse-ipa-artifact-name == '' && inputs.deploy-ios-to == 'none'
        env:
          SOURCE_SHA: ${{ steps.resolved-source-sha.outputs.value }}
        run: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo 'Expected a built .app bundle under build/ios/iphoneos, but none was found.'
            ls -la build/ios/iphoneos || true
            exit 1
          fi
          APP_BUNDLE_NAME=$(basename "$APP_PATH")

          bundle_executable_path() {
            local bundle_path="$1"
            local info_plist="$bundle_path/Info.plist"
            if [ ! -f "$info_plist" ]; then
              echo "Expected Info.plist at $info_plist" >&2
              return 1
            fi

            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist"
          }

          add_swift_scan_args() {
            local bundle_path="$1"
            local executable_name
            executable_name=$(bundle_executable_path "$bundle_path")
            SWIFT_SCAN_ARGS+=("--scan-executable" "$bundle_path/$executable_name")

            if [ -d "$bundle_path/Frameworks" ]; then
              SWIFT_SCAN_ARGS+=("--scan-folder" "$bundle_path/Frameworks")
            fi
          }

          rm -rf build/ios/unsigned
          mkdir -p build/ios/unsigned/Payload build/ios/ipa
          ditto "$APP_PATH" "build/ios/unsigned/Payload/$APP_BUNDLE_NAME"

          SWIFT_SUPPORT_DIR=build/ios/unsigned/SwiftSupport/iphoneos
          mkdir -p "$SWIFT_SUPPORT_DIR"
          declare -a SWIFT_SCAN_ARGS=()
          add_swift_scan_args "build/ios/unsigned/Payload/$APP_BUNDLE_NAME"
          if [ -d "build/ios/unsigned/Payload/$APP_BUNDLE_NAME/PlugIns" ]; then
            while IFS= read -r -d '' APPEX_PATH; do
              add_swift_scan_args "$APPEX_PATH"
            done < <(find "build/ios/unsigned/Payload/$APP_BUNDLE_NAME/PlugIns" -mindepth 1 -maxdepth 1 -name '*.appex' -type d -print0)
          fi
          xcrun swift-stdlib-tool --copy --platform iphoneos --destination "$SWIFT_SUPPORT_DIR" "${SWIFT_SCAN_ARGS[@]}"
          if ! find "$SWIFT_SUPPORT_DIR" -type f | grep -q .; then
            rm -rf build/ios/unsigned/SwiftSupport
          fi

          (
            cd build/ios/unsigned
            ZIP_INPUTS=(Payload)
            if [ -d SwiftSupport ]; then
              ZIP_INPUTS+=(SwiftSupport)
            fi
            zip -qry "../ipa/ios-unsigned-${BUILD_FLAVOR}-${BUILD_NAME}-${BUILD_NUMBER}-${SOURCE_SHA}.ipa" "${ZIP_INPUTS[@]}"
          )

      - name: Download reusable IPA artifact
        if: inputs.ios-reuse-ipa-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ios-reuse-run-id }}
          name: ${{ inputs.ios-reuse-ipa-artifact-name }}
          path: build/ios/ipa

      - name: Fetch PR commits
        if: inputs.pr-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          python3 << 'SCRIPT'
          import json, os, sys, uuid, urllib.request

          try:
              token = os.environ['GH_TOKEN']
              repo = os.environ['GITHUB_REPOSITORY']
              pr = os.environ['PR_NUMBER']
              base_url = f'https://api.github.com/repos/{repo}/pulls/{pr}/commits'
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
              }
              commits = []
              page = 1
              max_commits = 100
              while True:
                  url = f'{base_url}?per_page=100&page={page}'
                  req = urllib.request.Request(url, headers=headers)
                  data = json.loads(urllib.request.urlopen(req).read())
                  if not data:
                      break
                  commits.extend(data)
                  if len(data) < 100 or len(commits) >= max_commits:
                      break
                  page += 1
              commits = commits[:max_commits]
              lines = []
              for c in reversed(commits):
                  sha = c['sha'][:7]
                  msg = c['commit']['message'].split('\n')[0]
                  lines.append(f'{sha} {msg}')
              delim = f'FLUTTY_EOF_{uuid.uuid4().hex}'
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'FLUTTY_PR_COMMITS<<{delim}\n')
                  f.write('\n'.join(lines))
                  f.write(f'\n{delim}\n')
          except Exception as e:
              print(f'Warning: failed to fetch PR commits: {e}', file=sys.stderr)
          SCRIPT

      - name: Start iOS GitHub deployment
        id: start-ios-deployment
        if: inputs.deploy-ios-to != 'none' && inputs.run-ios-deploy
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_REF: ${{ steps.resolved-source-sha.outputs.value }}
          DEPLOYMENT_ENVIRONMENT: iOS ${{ inputs.flavor == 'private' && 'Private' || 'Production' }} / ${{ inputs.deploy-ios-to == 'appstore' && 'App Store' || 'TestFlight' }}
          DEPLOYMENT_DESCRIPTION: iOS ${{ inputs.flavor }} ${{ inputs.build-name }} (${{ inputs.build-number }}) to ${{ inputs.deploy-ios-to }}
          DEPLOYMENT_PRODUCTION_ENVIRONMENT: ${{ inputs.deploy-ios-to == 'appstore' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: process.env.DEPLOYMENT_REF,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: process.env.DEPLOYMENT_DESCRIPTION,
              required_contexts: [],
              auto_merge: false,
              production_environment: process.env.DEPLOYMENT_PRODUCTION_ENVIRONMENT === 'true',
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'iOS App Store Connect upload started.',
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              auto_inactive: false,
            });
            core.setOutput('deployment-id', String(deployment.data.id));

      - name: Download published store assets
        if: inputs.deploy-ios-to != 'none' && inputs.run-ios-deploy && inputs.sync-metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/store_assets.sh
          scripts/store_assets.sh download

      - name: Archive, sign & deploy via Fastlane
        id: ios-deploy
        if: inputs.deploy-ios-to != 'none'
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
          APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          FLUTTY_BUILD_NAME: ${{ inputs.build-name }}
          FLUTTY_VERSION_CODENAME: ${{ inputs.build-codename }}
          FLUTTY_SOURCE_SHA: ${{ steps.resolved-source-sha.outputs.value }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd ios
          SCHEME="${{ inputs.flavor == 'private' && 'Private' || 'Production' }}"
          SKIP_META=${{ inputs.sync-metadata && 'false' || 'true' }}
          REUSED_IPA_PATH=''
          if [ -n '${{ inputs.ios-reuse-ipa-artifact-name }}' ]; then
            REUSED_IPA_PATH=$(find ../build/ios/ipa -name '*.ipa' -print -quit)
            if [ -z "$REUSED_IPA_PATH" ]; then
              echo "Expected a reusable IPA artifact, but none was downloaded."
              find ../build/ios/ipa -maxdepth 4 -print || true
              exit 1
            fi
            REUSED_IPA_PATH="$(python3 -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$REUSED_IPA_PATH")"
          fi

          if [ "${{ inputs.ios-reuse-ipa-is-unsigned }}" = 'true' ]; then
            if [ -z "$REUSED_IPA_PATH" ]; then
              echo "ios-reuse-ipa-is-unsigned requires a reusable IPA artifact to be downloaded first."
              exit 1
            fi
            SIGNED_IPA_PATH="$(python3 -c 'import os; print(os.path.abspath("../build/ios/ipa/resigned-${{ inputs.flavor }}.ipa"))')"
            bundle exec fastlane resign_ipa \
              scheme:"$SCHEME" \
              unsigned_ipa_path:"$REUSED_IPA_PATH" \
              output_ipa_path:"$SIGNED_IPA_PATH"
            REUSED_IPA_PATH="$SIGNED_IPA_PATH"
          fi

          if [ "${{ inputs.run-ios-deploy }}" = "true" ]; then
            if [ "${{ inputs.deploy-ios-to }}" = "testflight" ]; then
              bundle exec fastlane beta scheme:"$SCHEME" skip_metadata:"$SKIP_META" ipa_path:"$REUSED_IPA_PATH"
            elif [ "${{ inputs.deploy-ios-to }}" = "appstore" ]; then
              APP_STORE_VERSION_OUTPUT="$RUNNER_TEMP/app-store-release-version"
              bundle exec ruby ../scripts/resolve_next_app_store_patch_version.rb \
                "$FLUTTY_BUILD_NAME" \
                xyz.depollsoft.monkeyssh \
                "$APP_STORE_VERSION_OUTPUT" \
                "$FLUTTY_BUILD_NAME" \
                prepare
              PREPARED_VERSION="$(cat "$APP_STORE_VERSION_OUTPUT")"
              if [ "$PREPARED_VERSION" != "$FLUTTY_BUILD_NAME" ]; then
                echo "::error title=App Store version mismatch::Prepared $PREPARED_VERSION but built $FLUTTY_BUILD_NAME."
                exit 1
              fi
              bundle exec fastlane release scheme:"$SCHEME" skip_metadata:"$SKIP_META" ipa_path:"$REUSED_IPA_PATH"
            fi
          elif [ -z "$REUSED_IPA_PATH" ]; then
            bundle exec fastlane build_ipa scheme:"$SCHEME"
          fi

      - name: Finish iOS GitHub deployment
        if: always() && inputs.deploy-ios-to != 'none' && inputs.run-ios-deploy && steps.start-ios-deployment.outputs['deployment-id'] != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ID: ${{ steps.start-ios-deployment.outputs['deployment-id'] }}
          DEPLOYMENT_STATE: ${{ steps.ios-deploy.outcome == 'success' && 'success' || 'failure' }}
          DEPLOYMENT_DESCRIPTION: ${{ steps.ios-deploy.outcome == 'success' && 'iOS App Store Connect upload completed.' || 'iOS App Store Connect upload failed.' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOYMENT_STATE,
              description: process.env.DEPLOYMENT_DESCRIPTION,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              auto_inactive: process.env.DEPLOYMENT_STATE === 'success',
            });

      - name: Prepare signed IPA artifact
        id: signed-ipa-artifact
        if: inputs.deploy-ios-to != 'none' && inputs.ios-reuse-ipa-artifact-name == ''
        run: |
          set -euo pipefail

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo 'Expected a signed IPA under build/ios/ipa, but none was found.'
            find build/ios/ipa -maxdepth 2 -print || true
            exit 1
          fi

          ARTIFACT_PATH="build/ios/ipa/ios-${BUILD_FLAVOR}-${BUILD_NAME}-${BUILD_NUMBER}.ipa"
          if [ "$IPA_PATH" != "$ARTIFACT_PATH" ]; then
            cp "$IPA_PATH" "$ARTIFACT_PATH"
          fi

          echo "path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed IPA artifact
        if: inputs.deploy-ios-to != 'none' && inputs.ios-reuse-ipa-artifact-name == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.signed-ipa-artifact.outputs.path }}
          archive: false

      - name: Upload unsigned IPA artifact
        if: inputs.build-ios-unsigned-ipa && inputs.ios-reuse-ipa-artifact-name == '' && inputs.deploy-ios-to == 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/ios/ipa/ios-unsigned-${{ inputs.flavor }}-${{ inputs.build-name }}-${{ inputs.build-number }}-${{ steps.resolved-source-sha.outputs.value }}.ipa
          archive: false

  deploy-status-summary:
    name: Summarize Deploy Status
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      android-deploy-status: ${{ steps.summary.outputs.android-deploy-status }}
      ios-deploy-status: ${{ steps.summary.outputs.ios-deploy-status }}
    steps:
      - name: Summarize platform deploy results
        id: summary
        env:
          BUILD_ANDROID_ENABLED: ${{ inputs.build-android }}
          BUILD_IOS_ENABLED: ${{ inputs.build-ios }}
          RUN_ANDROID_DEPLOY: ${{ inputs.run-android-deploy }}
          RUN_IOS_DEPLOY: ${{ inputs.run-ios-deploy }}
          ANDROID_TARGET: ${{ inputs.deploy-android-to }}
          IOS_TARGET: ${{ inputs.deploy-ios-to }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          android_status=''
          if [ "$BUILD_ANDROID_ENABLED" = 'true' ] && [ "$ANDROID_TARGET" != 'none' ]; then
            if [ "$RUN_ANDROID_DEPLOY" != 'true' ]; then
              android_status='⏭️ Android deploy skipped (run-android-deploy=false)'
            else
              case "$ANDROID_RESULT" in
                success)
                  if [ "$ANDROID_TARGET" = 'production' ]; then
                    android_status='✅ Deployed to Play production'
                  else
                    android_status='✅ Deployed to Play internal'
                  fi
                  ;;
                cancelled)
                  android_status='⛔ Android deploy cancelled'
                  ;;
                skipped)
                  android_status='⏭️ Android deploy skipped'
                  ;;
                *)
                  android_status='❌ Android deploy failed'
                  ;;
              esac
            fi
          fi

          ios_status=''
          if [ "$BUILD_IOS_ENABLED" = 'true' ] && [ "$IOS_TARGET" != 'none' ]; then
            if [ "$RUN_IOS_DEPLOY" != 'true' ]; then
              ios_status='⏭️ iOS deploy skipped (run-ios-deploy=false)'
            else
              case "$IOS_RESULT" in
                success)
                  if [ "$IOS_TARGET" = 'appstore' ]; then
                    ios_status='✅ Uploaded to App Store Connect'
                  else
                    ios_status='✅ Uploaded to TestFlight'
                  fi
                  ;;
                cancelled)
                  ios_status='⛔ iOS deploy cancelled'
                  ;;
                skipped)
                  ios_status='⏭️ iOS deploy skipped'
                  ;;
                *)
                  ios_status='❌ iOS deploy failed'
                  ;;
              esac
            fi
          fi

          echo "android-deploy-status=$android_status" >> "$GITHUB_OUTPUT"
          echo "ios-deploy-status=$ios_status" >> "$GITHUB_OUTPUT"

  update-android-deploy-comment:
    name: Update Android Deploy Comment
    needs: [build-android]
    if: always() && inputs.update-pr-deploy-comment && inputs.pr-number != '' && inputs.build-android && inputs.run-android-deploy && inputs.deploy-android-to != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Update Android status row
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number('${{ inputs.pr-number }}');
            const statusMarker = '<!-- preview-deploy-status -->';
            const androidTarget = '${{ inputs.deploy-android-to }}';
            const androidResult = '${{ needs.build-android.result }}';

            let androidStatus = '❌ Android deploy failed';
            if (androidResult === 'success') {
              androidStatus =
                androidTarget === 'production'
                  ? '✅ Deployed to Play production'
                  : '✅ Deployed to Play internal';
            } else if (androidResult === 'cancelled') {
              androidStatus = '⛔ Android deploy cancelled';
            } else if (androidResult === 'skipped') {
              androidStatus = '⏭️ Android deploy skipped';
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(statusMarker));
            if (!existing || !existing.body) {
              core.info(`No preview deploy status comment found for PR #${issueNumber}.`);
              return;
            }

            const updatedBody = existing.body
              .split('\n')
              .map((line) =>
                line.startsWith('| **Android Status** |')
                  ? `| **Android Status** | ${androidStatus} |`
                  : line,
              )
              .join('\n');

            if (updatedBody === existing.body) {
              core.info(`Android status row missing on preview deploy comment for PR #${issueNumber}.`);
              return;
            }

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body: updatedBody,
            });

  update-ios-deploy-comment:
    name: Update iOS Deploy Comment
    needs: [build-ios]
    if: always() && inputs.update-pr-deploy-comment && inputs.pr-number != '' && inputs.build-ios && inputs.run-ios-deploy && inputs.deploy-ios-to != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Update iOS status row
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number('${{ inputs.pr-number }}');
            const statusMarker = '<!-- preview-deploy-status -->';
            const iosTarget = '${{ inputs.deploy-ios-to }}';
            const iosResult = '${{ needs.build-ios.result }}';

            let iosStatus = '❌ iOS deploy failed';
            if (iosResult === 'success') {
              iosStatus =
                iosTarget === 'appstore'
                  ? '✅ Uploaded to App Store Connect'
                  : '✅ Uploaded to TestFlight';
            } else if (iosResult === 'cancelled') {
              iosStatus = '⛔ iOS deploy cancelled';
            } else if (iosResult === 'skipped') {
              iosStatus = '⏭️ iOS deploy skipped';
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(statusMarker));
            if (!existing || !existing.body) {
              core.info(`No preview deploy status comment found for PR #${issueNumber}.`);
              return;
            }

            const updatedBody = existing.body
              .split('\n')
              .map((line) =>
                line.startsWith('| **iOS Status** |')
                  ? `| **iOS Status** | ${iosStatus} |`
                  : line,
              )
              .join('\n');

            if (updatedBody === existing.body) {
              core.info(`iOS status row missing on preview deploy comment for PR #${issueNumber}.`);
              return;
            }

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body: updatedBody,
            });

  record-private-deploy-build-number:
    name: Record Private Deploy Build Number
    needs: [build-android, build-ios]
    if: inputs.flavor == 'private' && (inputs.deploy-ios-to != 'none' || inputs.deploy-android-to != 'none') && needs.build-android.result == 'success' && needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write private deploy build marker
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          mkdir -p build/private-deploy-marker
          printf '%s\n' "$BUILD_NUMBER" > build/private-deploy-marker/build-number.txt

      - name: Upload private deploy build marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: private-deploy-build-number-${{ inputs.build-number }}
          path: build/private-deploy-marker/build-number.txt
