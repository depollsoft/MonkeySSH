name: Compute build version
description: >-
  Resolve the build name, number, codename and display string that the build
  workflows hand to build-deploy.yml, validating them once.

inputs:
  source:
    description: >-
      Checkout of the source being built. Its pubspec.yaml supplies the default
      build name and its scripts/version_codename.py the codename.
    default: '.'
  build-name:
    description: Use this version instead of the one in the source pubspec.yaml.
    default: ''
  build-number:
    description: >-
      Empty for the clock (seconds / 10); `pull-request` for the PR event's
      update time, which every platform workflow of one push shares; otherwise
      the build number itself.
    default: ''

outputs:
  build-name:
    value: ${{ steps.version.outputs.build-name }}
  build-number:
    value: ${{ steps.version.outputs.build-number }}
  build-codename:
    value: ${{ steps.version.outputs.build-codename }}
  build-display:
    value: ${{ steps.version.outputs.build-display }}

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        BUILD_NAME: ${{ inputs.build-name }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        # The PR-event helper runs from the action's own (workflow) checkout, so
        # PR heads that predate it still get the shared build number.
        BUILD_NUMBER_SCRIPT: ${{ github.action_path }}/../../../scripts/preview_build_number.py
      run: |
        set -euo pipefail
        if [ -z "$BUILD_NAME" ]; then
          BUILD_NAME="$(grep '^version:' "$SOURCE/pubspec.yaml" | head -n 1 | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1 | xargs)"
        fi
        # build-deploy.yml enforces the same pattern in validate-build-inputs.
        if [[ ! "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
          echo "::error title=Invalid build name::Expected a semantic version such as 1.2.3 or 1.2.3-pr.42; got '$BUILD_NAME'."
          exit 1
        fi
        case "$BUILD_NUMBER" in
          '') BUILD_NUMBER=$(( $(date +%s) / 10 )) ;;
          pull-request) BUILD_NUMBER="$(python3 "$BUILD_NUMBER_SCRIPT")" ;;
        esac
        if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || (( BUILD_NUMBER > 2147483647 )); then
          echo "::error title=Invalid build number::Expected a positive Android-compatible build number; got '$BUILD_NUMBER'."
          exit 1
        fi
        BUILD_CODENAME="$(python3 "$SOURCE/scripts/version_codename.py" "$BUILD_NAME")"
        BUILD_DISPLAY="$BUILD_NAME"
        if [ -n "$BUILD_CODENAME" ]; then
          BUILD_DISPLAY="$BUILD_NAME \"$BUILD_CODENAME\""
        fi
        {
          echo "build-name=$BUILD_NAME"
          echo "build-number=$BUILD_NUMBER"
          echo "build-codename=$BUILD_CODENAME"
          echo "build-display=$BUILD_DISPLAY"
        } >> "$GITHUB_OUTPUT"
