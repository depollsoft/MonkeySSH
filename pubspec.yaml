---
name: monkeyssh
description: >
  A mobile SSH workspace for agentic coding with terminal emulation, SFTP,
  MonkeyMux/tmux remote windows, key management, snippets, and port forwarding.
publish_to: 'none'

version: 0.4.1+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.5.0

  # Database
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # SSH
  dartssh2: ^3.3.1

  # Terminal
  # Vendored fork of xterm.dart 4.0.0 (upstream unmaintained since 2024-02).
  # Maintained in third_party/xterm with emulation-core fixes ported from
  # xterm.js.
  xterm:
    path: third_party/xterm

  # Syntax highlighting
  highlight: ^0.7.0

  # Secure storage
  flutter_secure_storage: ^11.0.0

  # Biometrics
  local_auth: ^3.0.2

  # File handling
  file_picker: ^12.1.1
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  share_plus: ^13.3.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0

  # UI
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  # Markdown rendering for ACP assistant messages. flutter_markdown_plus is the
  # maintained continuation of the discontinued official flutter_markdown; the
  # markdown parser is a direct dependency because custom code-block builders
  # reference its AST types.
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  flutter_local_notifications: ^22.3.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  cross_file: ^0.3.5+5
  equatable: ^2.1.0
  pasteboard: ^0.5.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11+1
  quick_actions: ^1.1.0
  video_player: ^2.14.0
  http: ^1.6.0
  xml: ^7.0.1

  # Network / connectivity
  network_info_plus: ^8.2.1
  permission_handler: ^13.0.1
  wakelock_plus: ^1.7.0
  sqlite3: ^3.5.2
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  mime: ^2.0.0

dependency_overrides:
  # Play Billing can invoke one callback twice and crash Android while the app
  # is backgrounded. Use the vendored upstream single-reply guard until Flutter
  # packages releases it: https://github.com/flutter/packages/pull/12640
  in_app_purchase_android:
    path: third_party/in_app_purchase_android
  # permission_handler_apple's Package.swift derives the PERMISSION_* macros by
  # discovering the host Info.plist, walking up from the working directory and
  # from #file. A pub.dev install puts #file in ~/.pub-cache, where the walk can
  # never reach the app, so Xcode.app builds (working directory "/") silently
  # compile out camera, microphone and location. Vendoring puts #file inside the
  # repo so every build path agrees. Tracking removal in #790.
  permission_handler_apple:
    path: third_party/permission_handler_apple

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.0
  drift_dev: ^2.34.0
  # Pin: the current Flutter SDK caps analyzer at 12.x, so drift_dev is held at
  # 2.34.0 (2.34.1+ needs analyzer ^13). drift_dev 2.34.0 calls
  # DartPlaceholder.when(), which sqlparser removed in 0.44.6, so keep sqlparser
  # at 0.44.5. Remove this pin once a newer Flutter SDK unblocks drift_dev.
  sqlparser: 0.45.0

  # Testing
  mocktail: ^1.0.5
  wakelock_plus_platform_interface: ^1.6.0
  integration_test:
    sdk: flutter

  # App icons
  flutter_launcher_icons: ^0.14.4

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/monkeymux/manifest.json
    - assets/monkeymux/bin/darwin-amd64/
    - assets/monkeymux/bin/darwin-arm64/
    - assets/monkeymux/bin/linux-amd64/
    - assets/monkeymux/bin/linux-arm64/
    - assets/monkeymux/bin/windows-amd64/
    - assets/monkeymux/bin/windows-arm64/
    - remote/monkeymux/conpty/LICENSE.microsoft-terminal
    - assets/version_codenames.json
    # - assets/icons/
    # - assets/fonts/
